<!doctype html>
<html lang="es" style="background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tu espiral · Triggui</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TRIGGUI ESPIRAL · Portal /mi · v1.0.0
   Habitación privada de miembros. Lenguaje calcado de las
   ediciones vivas: fondo, resplandor, tipografías, pulse-line.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  background: #000 !important;
  color: #fff;
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Archivo', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

vercel-live-feedback,[data-vercel-toolbar],#__vercel_live_token,vercel-toolbar{display:none!important;height:0!important;overflow:hidden!important;}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(40, 100, 220, 0.14), transparent 65%),
    radial-gradient(ellipse at 70% 80%, rgba(80, 230, 200, 0.06), transparent 65%);
  z-index: -1;
  pointer-events: none;
  opacity: 0.9;
}

.pulse-line {
  position: fixed;
  top: 16px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Poppins', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,.4);
  z-index: 50;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .8s ease, transform .8s ease;
  pointer-events: none;
  user-select: none;
  text-transform: uppercase;
}
.pulse-line.visible { opacity: 1; transform: translateY(0); }

/* ---------- Escenario de la espiral ---------- */
#cielo {
  position: fixed;
  inset: 0;
  display: none;
}
#cielo.ver { display: block; }

.nodo {
  position: absolute;
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.22);
  box-shadow: 0 8px 24px rgba(0,0,0,.55);
  transform: translate(-50%, -50%) scale(0);
  transition: transform .7s cubic-bezier(0.19,1,0.22,1), border-color .4s ease, box-shadow .4s ease;
  background: #14141c;
  animation: nodoFloat 6s ease-in-out infinite;
}
.nodo.nacer { transform: translate(-50%, -50%) scale(1); }
.nodo img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.nodo:active { transform: translate(-50%, -50%) scale(0.94); }
.nodo.dorada {
  border-color: #f6c453;
  box-shadow: 0 0 0 2px rgba(246,196,83,.35), 0 0 26px rgba(246,196,83,.35), 0 8px 24px rgba(0,0,0,.55);
}
@keyframes nodoFloat {
  0%, 100% { margin-top: 0; }
  50% { margin-top: -5px; }
}

#centroGlow {
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(227,93,48,0.22) 0%, transparent 70%);
  filter: blur(30px);
  pointer-events: none;
  animation: glowPulse 5s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }

/* ---------- Vacío y carga ---------- */
.centro-msg {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 36px;
  z-index: 5;
}
.centro-msg.ver { display: flex; }
.esp-glifo { width: 54px; height: 54px; margin-bottom: 22px; opacity: .9; }
.centro-msg .t1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(20px, 5.4vw, 27px);
  color: rgba(255,255,255,.92);
  margin: 0 0 10px;
}
.centro-msg .t2 {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(13px, 3.6vw, 15px);
  font-weight: 500;
  line-height: 1.55;
  color: rgba(255,255,255,.5);
  margin: 0;
  max-width: 340px;
}
.loading-text { animation: breatheLoading 1.5s infinite ease-in-out; color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 1.5px; font-family: 'Poppins', sans-serif; }
@keyframes breatheLoading { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

/* ---------- Puerta (clave) ---------- */
#puerta {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  z-index: 10;
}
#puerta.ver { display: flex; }
.puerta-card {
  width: 100%;
  max-width: 340px;
  background: rgba(12,12,18,.96);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 18px;
  padding: 30px 24px 24px;
  text-align: center;
}
.puerta-card img.marca { height: 20px; width: auto; opacity: .9; margin-bottom: 18px; filter: invert(1) brightness(1.4); }
.puerta-card h1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 24px;
  margin: 0 0 6px;
  color: #fff;
}
.puerta-card p.sub {
  font-family: 'Poppins', sans-serif;
  font-size: 12.5px;
  color: rgba(255,255,255,.55);
  margin: 0 0 18px;
  line-height: 1.5;
}
.puerta-card input {
  width: 100%;
  padding: 13px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.06);
  color: #fff;
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  text-align: center;
  letter-spacing: .14em;
  outline: none;
}
.puerta-card input:focus { border-color: rgba(227,93,48,.7); }
.puerta-err { min-height: 18px; font-size: 12px; color: #ff9d9d; margin: 9px 0 3px; font-family: 'Poppins', sans-serif; }
.puerta-card button {
  width: 100%;
  padding: 13px 0;
  border-radius: 12px;
  border: 1px solid rgba(227,93,48,.65);
  background: rgba(227,93,48,.16);
  color: #fff;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .2s ease, background .2s ease;
}
.puerta-card button:active { transform: scale(.97); }
.puerta-pie { margin-top: 16px; font-size: 11px; font-family: 'Poppins', sans-serif; }
.puerta-pie a { color: rgba(255,255,255,.5); text-decoration: underline; }

/* ---------- Hoja del libro ---------- */
#velo {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.85);
  opacity: 0;
  transition: opacity .3s ease;
  padding: max(16px, env(safe-area-inset-top,16px)) 16px max(16px, env(safe-area-inset-bottom,16px));
}
#velo.ver { display: flex; }
#velo.on { opacity: 1; }
.hoja {
  width: 100%;
  max-width: 380px;
  background: #121219;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 20px;
  padding: 26px 22px 22px;
  text-align: center;
  position: relative;
  transform: scale(.94) translateY(14px);
  opacity: 0;
  transition: transform .45s cubic-bezier(0.19,1,0.22,1), opacity .4s ease;
}
#velo.on .hoja { transform: scale(1) translateY(0); opacity: 1; }
.hoja .cerrar {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}
.hoja img.portada {
  width: 128px;
  height: auto;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 22px 48px rgba(0,0,0,.8);
  margin: 4px auto 14px;
  display: block;
}
.hoja h2 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(19px, 5vw, 23px);
  margin: 0 0 8px;
  color: #fff;
  line-height: 1.25;
}
.hoja .meta {
  font-family: 'Poppins', sans-serif;
  font-size: 11.5px;
  color: rgba(255,255,255,.5);
  margin: 0 0 6px;
  letter-spacing: .04em;
}
.hoja .sello {
  display: inline-block;
  font-family: 'Poppins', sans-serif;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .08em;
  color: #f6c453;
  border: 1px solid rgba(246,196,83,.5);
  border-radius: 10px;
  padding: 4px 10px;
  margin: 2px 0 14px;
}
.hoja .btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 13px 0;
  border-radius: 12px;
  font-family: 'Poppins', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  margin-top: 9px;
  transition: transform .2s ease;
}
.hoja .btn:active { transform: scale(.97); }
.hoja .btn.abrir { color: #fff; border: 1px solid rgba(227,93,48,.7); background: rgba(227,93,48,.16); }
.hoja .btn.papel { color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.2); background: transparent; }

/* ---------- Pie ---------- */
#pie {
  position: fixed;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: 0;
  right: 0;
  text-align: center;
  z-index: 40;
  display: none;
}
#pie.ver { display: block; }
#pie img { height: 18px; width: auto; opacity: .22; filter: invert(1) brightness(1.5); display: inline-block; }
#pie .cambiar {
  display: block;
  margin-top: 6px;
  font-family: 'Poppins', sans-serif;
  font-size: 10px;
  color: rgba(255,255,255,.28);
  text-decoration: none;
  letter-spacing: .06em;
}
</style>
</head>
<body>

<div id="pulseLine" class="pulse-line"></div>

<div id="cargando" class="centro-msg ver">
  <span class="loading-text">Abriendo tu espiral...</span>
</div>

<div id="puerta">
  <div class="puerta-card">
    <img class="marca" src="https://raw.githubusercontent.com/badirnakid/triggui-app/main/public/trigguiletras2.png" alt="Triggui">
    <h1>Tu espiral</h1>
    <p class="sub">El lugar donde viven los libros que te han tocado.</p>
    <input id="clave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tu clave de miembro">
    <div class="puerta-err" id="puertaErr"></div>
    <button id="entrar" type="button">Entrar</button>
    <div class="puerta-pie"><a href="https://triggui.com" target="_blank" rel="noopener">¿Aún no eres miembro?</a></div>
  </div>
</div>

<div id="vacio" class="centro-msg">
  <svg class="esp-glifo" viewBox="0 0 24 24" fill="none" stroke="#E35D30" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12.6 12.2 a2.6 2.6 0 1 1 -2.6 2.6 a5.2 5.2 0 1 1 5.2 -5.2 a8.2 8.2 0 1 1 -8.4 8.3"/></svg>
  <p class="t1">Tu espiral está lista.</p>
  <p class="t2">Cuando marques un libro que te llegue, aquí nacerá su estrella. La primera vivirá en el centro, y todo lo demás crecerá alrededor.</p>
</div>

<div id="cielo"><div id="centroGlow"></div></div>

<div id="velo">
  <div class="hoja" id="hoja"></div>
</div>

<div id="pie">
  <img src="https://raw.githubusercontent.com/badirnakid/triggui-app/main/public/trigguiletras2.png" alt="Triggui">
  <a class="cambiar" href="#" id="cambiarClave">cambiar clave</a>
</div>

<script>
'use strict';

/* ============================================================
   Constantes y llavero (compartido con el boton de las ediciones)
   ============================================================ */
var EXEC = 'https://script.google.com/macros/s/AKfycbwWcUceg333PMcmSsLbEUAsx3os8AJ3Wdmjruv7zshHTqNmoxTastOsDU1h7V8qPk0nIQ/exec';
var LS_PAR = 'triggui_espiral_v1';
var LS_CACHE = 'triggui_espiral_cache_v1';
var ORO = 2.39996322972865332; /* angulo aureo en radianes: 137.507... grados */

function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }

var el = {
  linea: document.getElementById('pulseLine'),
  cargando: document.getElementById('cargando'),
  puerta: document.getElementById('puerta'),
  puertaErr: document.getElementById('puertaErr'),
  clave: document.getElementById('clave'),
  entrar: document.getElementById('entrar'),
  vacio: document.getElementById('vacio'),
  cielo: document.getElementById('cielo'),
  glow: document.getElementById('centroGlow'),
  velo: document.getElementById('velo'),
  hoja: document.getElementById('hoja'),
  pie: document.getElementById('pie'),
  cambiar: document.getElementById('cambiarClave')
};

var estado = { nombre: '', nodos: [], clave: '' };

/* ---------- Link magico #k= ---------- */
(function magia(){
  var h = String(window.location.hash || '');
  var m = h.match(/[#&]k=([^&]+)/);
  if (m && m[1]) {
    lsSet(LS_PAR, JSON.stringify({ c: decodeURIComponent(m[1]).trim() }));
    try { history.replaceState(null, '', window.location.pathname); } catch(e){}
  }
})();

function claveGuardada(){
  try { var p = JSON.parse(lsGet(LS_PAR) || 'null'); return (p && p.c) ? String(p.c) : ''; }
  catch(e){ return ''; }
}

/* ---------- Vistas ---------- */
function ver(cual){
  el.cargando.classList.toggle('ver', cual === 'cargando');
  el.puerta.classList.toggle('ver', cual === 'puerta');
  el.vacio.classList.toggle('ver', cual === 'vacio');
  el.cielo.classList.toggle('ver', cual === 'cielo');
  el.pie.classList.toggle('ver', cual === 'cielo' || cual === 'vacio');
  if (cual === 'puerta') setTimeout(function(){ try{ el.clave.focus(); }catch(e){} }, 80);
}

function linea(txt){
  el.linea.textContent = txt;
  el.linea.classList.add('visible');
}

/* ---------- Datos ---------- */
function agrupar(filas){
  var mapa = {};
  var orden = [];
  for (var i = 0; i < filas.length; i++) {
    var f = filas[i];
    if (!f || !f.slug) continue;
    var llave = (f.catalogo || 'adulto') + ':' + f.slug;
    if (!mapa[llave]) {
      mapa[llave] = { slug: f.slug, catalogo: f.catalogo || 'adulto', titulo: '', portada: '', ts: '', dorada: false };
      orden.push(llave);
    }
    var n = mapa[llave];
    if (f.evento === 'estrella') {
      if (!n.ts) n.ts = f.ts;
      if (f.titulo) n.titulo = f.titulo;
      if (f.portada) n.portada = f.portada;
    }
    if (f.evento === 'releida') n.dorada = true;
    if (!n.titulo && f.titulo) n.titulo = f.titulo;
    if (!n.portada && f.portada) n.portada = f.portada;
  }
  var nodos = [];
  for (var j = 0; j < orden.length; j++) {
    var nd = mapa[orden[j]];
    if (nd.ts || nd.titulo) nodos.push(nd);
  }
  nodos.sort(function(a, b){ return String(a.ts).localeCompare(String(b.ts)); });
  return nodos;
}

function pedirEspiral(clave, cb){
  var cuerpo = new URLSearchParams();
  cuerpo.append('accion', 'espiral');
  cuerpo.append('clave', clave);
  fetch(EXEC, { method: 'POST', body: cuerpo })
    .then(function(r){ return r.json(); })
    .then(function(r){ cb(null, r); })
    .catch(function(e){ cb(e, null); });
}

/* ---------- Espiral aurea (filotaxis) ---------- */
function pintar(){
  var nodos = estado.nodos;
  el.cielo.querySelectorAll('.nodo').forEach(function(n){ n.remove(); });

  linea('Hola' + (estado.nombre ? ', ' + estado.nombre : '') + ' · ' +
        nodos.length + (nodos.length === 1 ? ' estrella' : ' estrellas'));

  if (nodos.length === 0) { ver('vacio'); return; }
  ver('cielo');

  var W = window.innerWidth, H = window.innerHeight;
  var cx = W / 2, cy = H * 0.485;
  var d = nodos.length <= 8 ? 72 : nodos.length <= 20 ? 64 : nodos.length <= 45 ? 56 : 46;
  var margen = d / 2 + 14;
  var maxR = Math.min(W, H) / 2 - margen - 24;
  var C = nodos.length > 1 ? (maxR / Math.sqrt(nodos.length - 1)) : 0;

  el.glow.style.left = cx + 'px';
  el.glow.style.top = cy + 'px';

  for (var i = 0; i < nodos.length; i++) {
    (function(i){
      var nd = nodos[i];
      var ang = i * ORO;
      var r = C * Math.sqrt(i);
      var x = cx + r * Math.cos(ang);
      var y = cy + r * Math.sin(ang);

      var div = document.createElement('div');
      div.className = 'nodo' + (nd.dorada ? ' dorada' : '');
      div.style.width = d + 'px';
      div.style.height = d + 'px';
      div.style.left = x + 'px';
      div.style.top = y + 'px';
      div.style.animationDelay = (i * 0.35) + 's';
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', nd.titulo || nd.slug);

      if (nd.portada) {
        var img = document.createElement('img');
        img.src = nd.portada;
        img.alt = '';
        img.loading = 'lazy';
        div.appendChild(img);
      }
      div.addEventListener('click', function(){ abrirHoja(nd); });
      el.cielo.appendChild(div);
      setTimeout(function(){ div.classList.add('nacer'); }, 60 + i * 90);
    })(i);
  }
}

/* ---------- Hoja del libro ---------- */
function fechaBonita(iso){
  try {
    var dt = new Date(iso);
    return dt.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e){ return ''; }
}

function abrirHoja(nd){
  var url = (nd.catalogo === 'kids' ? '/kids/t/' : '/t/') + encodeURIComponent(nd.slug) + '/';
  var busca = 'https://www.buscalibre.com.mx/libros/search/?q=' + encodeURIComponent(nd.titulo || nd.slug);

  el.hoja.innerHTML =
    '<button class="cerrar" id="hojaCerrar" aria-label="Cerrar">&times;</button>' +
    (nd.portada ? '<img class="portada" src="' + nd.portada.replace(/"/g, '&quot;') + '" alt="">' : '') +
    '<h2></h2>' +
    '<p class="meta" id="hojaMeta"></p>' +
    (nd.dorada ? '<span class="sello">RELE\u00cdDA</span>' : '') +
    '<a class="btn abrir" id="hojaAbrir">Abrir edici\u00f3n viva</a>' +
    '<a class="btn papel" href="' + busca + '" target="_blank" rel="noopener">Este libro existe en papel</a>';

  el.hoja.querySelector('h2').textContent = nd.titulo || nd.slug;
  document.getElementById('hojaMeta').textContent =
    'En tu espiral desde el ' + (fechaBonita(nd.ts) || 'primer d\u00eda');

  document.getElementById('hojaCerrar').addEventListener('click', cerrarHoja);
  document.getElementById('hojaAbrir').addEventListener('click', function(ev){
    ev.preventDefault();
    releerYNavegar(nd, url);
  });

  el.velo.classList.add('ver');
  requestAnimationFrame(function(){ el.velo.classList.add('on'); });
}

function cerrarHoja(){
  el.velo.classList.remove('on');
  setTimeout(function(){ el.velo.classList.remove('ver'); }, 320);
}

el.velo.addEventListener('click', function(ev){ if (ev.target === el.velo) cerrarHoja(); });

/* Registrar la relectura un instante antes de navegar.
   Si la red falla o tarda, leer SIEMPRE gana (tope 600 ms). */
function releerYNavegar(nd, url){
  var cuerpo = new URLSearchParams();
  cuerpo.append('accion', 'marcar');
  cuerpo.append('clave', estado.clave);
  cuerpo.append('slug', nd.slug);
  cuerpo.append('catalogo', nd.catalogo);
  cuerpo.append('evento', 'releida');
  cuerpo.append('titulo', nd.titulo || '');
  cuerpo.append('portada', nd.portada || '');

  var listo = false;
  function irse(){ if (!listo) { listo = true; window.location.href = url; } }
  try {
    fetch(EXEC, { method: 'POST', body: cuerpo, keepalive: true })
      .then(irse)['catch'](irse);
  } catch(e){ irse(); }
  setTimeout(irse, 600);
}

/* ---------- Arranque ---------- */
function fallo(mensaje){
  ver('puerta');
  el.puertaErr.textContent = mensaje || '';
}

function cargarConClave(clave, esNueva){
  estado.clave = clave;
  pedirEspiral(clave, function(err, r){
    if (err) {
      var cache = null;
      try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
      if (cache && cache.nodos) {
        estado.nombre = cache.nombre || '';
        estado.nodos = cache.nodos;
        pintar();
        linea('Sin conexi\u00f3n · mostrando tu \u00faltima espiral');
        return;
      }
      fallo('Sin conexi\u00f3n. Intenta de nuevo.');
      return;
    }
    if (!r || r.ok !== true) {
      lsDel(LS_PAR);
      fallo(r && r.error === 'clave' ? 'Clave no reconocida.' : 'Algo fall\u00f3. Intenta de nuevo.');
      return;
    }
    if (esNueva) lsSet(LS_PAR, JSON.stringify({ c: clave }));
    estado.nombre = r.nombre || '';
    estado.nodos = agrupar(r.estrellas || []);
    lsSet(LS_CACHE, JSON.stringify({ nombre: estado.nombre, nodos: estado.nodos, ts: Date.now() }));
    pintar();
  });
}

el.entrar.addEventListener('click', function(){
  var c = (el.clave.value || '').trim();
  if (c.length < 6) { el.puertaErr.textContent = 'Esa clave se ve corta.'; return; }
  el.puertaErr.textContent = '';
  ver('cargando');
  cargarConClave(c, true);
});
el.clave.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') el.entrar.click(); });

el.cambiar.addEventListener('click', function(ev){
  ev.preventDefault();
  lsDel(LS_PAR);
  el.clave.value = '';
  fallo('');
});

window.addEventListener('resize', function(){
  if (el.cielo.classList.contains('ver')) pintar();
});

(function inicio(){
  var c = claveGuardada();
  if (!c) { ver('puerta'); return; }
  var cache = null;
  try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
  if (cache && cache.nodos && cache.nodos.length) {
    estado.nombre = cache.nombre || '';
    estado.nodos = cache.nodos;
    pintar();
  } else {
    ver('cargando');
  }
  cargarConClave(c, false);
})();
</script>
</body>
</html>
