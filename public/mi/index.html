<!doctype html>
<html lang="es" style="background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tu espiral · Triggui</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TRIGGUI ESPIRAL · Portal /mi · v1.0.0
   Habitación privada de miembros. Lenguaje calcado de las
   ediciones vivas: fondo, resplandor, tipografías, pulse-line.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  background: #000 !important;
  color: #fff;
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Archivo', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

vercel-live-feedback,[data-vercel-toolbar],#__vercel_live_token,vercel-toolbar{display:none!important;height:0!important;overflow:hidden!important;}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(40, 100, 220, 0.14), transparent 65%),
    radial-gradient(ellipse at 70% 80%, rgba(80, 230, 200, 0.06), transparent 65%);
  z-index: -1;
  pointer-events: none;
  opacity: 0.9;
}

.pulse-line {
  position: fixed;
  top: 16px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Poppins', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,.4);
  z-index: 50;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .8s ease, transform .8s ease;
  pointer-events: none;
  user-select: none;
  text-transform: uppercase;
}
.pulse-line.visible { opacity: 1; transform: translateY(0); }

/* ---------- Muro de laminas ---------- */
#muro {
  position: fixed;
  inset: 0;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 64px 16px 110px;
}
#muro::-webkit-scrollbar { display: none; }
#muro.ver { display: block; }
#muroInner {
  max-width: 780px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 30px;
  justify-items: center;
}
@media (min-width: 700px) {
  #muroInner { grid-template-columns: 1fr 1fr; gap: 34px 26px; }
}
.lamina {
  position: relative;
  width: min(84vw, 340px);
  border-radius: 16px;
  cursor: pointer;
  opacity: 0;
  transform: translateY(22px) scale(.985) rotate(0deg);
  transition: opacity .7s cubic-bezier(0.19,1,0.22,1), transform .7s cubic-bezier(0.19,1,0.22,1), box-shadow .4s ease;
  box-shadow: 0 18px 44px rgba(0,0,0,.55);
}
.lamina.ver { opacity: 1; transform: translateY(0) scale(1) rotate(var(--giro, 0deg)); }
.lamina:hover { transform: translateY(-4px) scale(1.012) rotate(0deg); box-shadow: 0 26px 60px rgba(0,0,0,.65); }
.lamina:active { transform: scale(.985) rotate(0deg); }
.lamina img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.14);
  pointer-events: none;
  background: #101017;
}
.lamina.dorada img { border-color: rgba(246,196,83,.8); }
.lamina.dorada {
  box-shadow: 0 0 0 2px rgba(246,196,83,.35), 0 0 34px rgba(246,196,83,.28), 0 18px 44px rgba(0,0,0,.55);
}
.lamina .sello {
  position: absolute;
  top: 10px;
  right: 10px;
  font-family: 'Poppins', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  color: #f6c453;
  background: rgba(10,10,14,.78);
  border: 1px solid rgba(246,196,83,.55);
  border-radius: 9px;
  padding: 4px 9px;
  pointer-events: none;
}
.marco {
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.14);
  background: #101017;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 18px;
  pointer-events: none;
}
.marco img.mini {
  width: 58%;
  height: auto;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 20px 44px rgba(0,0,0,.7);
}
.marco .mt {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 17px;
  color: rgba(255,255,255,.92);
  text-align: center;
  line-height: 1.3;
}

/* ---------- Pie ---------- */
#pie {
  position: fixed;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  left: 0;
  right: 0;
  text-align: center;
  z-index: 40;
  display: none;
}
#pie.ver { display: block; }
#pie img { height: 18px; width: auto; opacity: .22; filter: invert(1) brightness(1.5); display: inline-block; }
#pie .cambiar {
  display: block;
  margin-top: 6px;
  font-family: 'Poppins', sans-serif;
  font-size: 10px;
  color: rgba(255,255,255,.28);
  text-decoration: none;
  letter-spacing: .06em;
}
</style>
</head>
<body>

<div id="pulseLine" class="pulse-line"></div>

<div id="cargando" class="centro-msg ver">
  <span class="loading-text">Abriendo tu espiral...</span>
</div>

<div id="puerta">
  <div class="puerta-card">
    <img class="marca" src="https://raw.githubusercontent.com/badirnakid/triggui-app/main/public/trigguiletras2.png" alt="Triggui">
    <h1>Tu espiral</h1>
    <p class="sub">El lugar donde viven los libros que te han tocado.</p>
    <input id="clave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tu clave de miembro">
    <div class="puerta-err" id="puertaErr"></div>
    <button id="entrar" type="button">Entrar</button>
    <div class="puerta-pie"><a href="https://triggui.com" target="_blank" rel="noopener">¿Aún no eres miembro?</a></div>
  </div>
</div>

<div id="vacio" class="centro-msg">
  <svg class="esp-glifo" viewBox="0 0 24 24" fill="none" stroke="#E35D30" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12.6 12.2 a2.6 2.6 0 1 1 -2.6 2.6 a5.2 5.2 0 1 1 5.2 -5.2 a8.2 8.2 0 1 1 -8.4 8.3"/></svg>
  <p class="t1">Tu espiral está lista.</p>
  <p class="t2">Cuando marques un libro que te llegue, aquí nacerá su estrella. La primera vivirá en el centro, y todo lo demás crecerá alrededor.</p>
</div>

<div id="muro"><div id="muroInner"></div></div>

<div id="pie">
  <img src="https://raw.githubusercontent.com/badirnakid/triggui-app/main/public/trigguiletras2.png" alt="Triggui">
  <a class="cambiar" href="#" id="cambiarClave">cambiar clave</a>
</div>

<script>
'use strict';

/* ============================================================
   Constantes y llavero (compartido con el boton de las ediciones)
   ============================================================ */
var EXEC = 'https://script.google.com/macros/s/AKfycbwWcUceg333PMcmSsLbEUAsx3os8AJ3Wdmjruv7zshHTqNmoxTastOsDU1h7V8qPk0nIQ/exec';
var LS_PAR = 'triggui_espiral_v1';
var LS_CACHE = 'triggui_espiral_cache_v1';
var ORO = 2.39996322972865332; /* angulo aureo en radianes: 137.507... grados */

function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }

var el = {
  linea: document.getElementById('pulseLine'),
  cargando: document.getElementById('cargando'),
  puerta: document.getElementById('puerta'),
  puertaErr: document.getElementById('puertaErr'),
  clave: document.getElementById('clave'),
  entrar: document.getElementById('entrar'),
  vacio: document.getElementById('vacio'),
  muro: document.getElementById('muro'),
  muroInner: document.getElementById('muroInner'),
  pie: document.getElementById('pie'),
  cambiar: document.getElementById('cambiarClave')
};

var estado = { nombre: '', nodos: [], clave: '' };

/* ---------- Link magico #k= ---------- */
(function magia(){
  var h = String(window.location.hash || '');
  var m = h.match(/[#&]k=([^&]+)/);
  if (m && m[1]) {
    lsSet(LS_PAR, JSON.stringify({ c: decodeURIComponent(m[1]).trim() }));
    try { history.replaceState(null, '', window.location.pathname); } catch(e){}
  }
})();

function claveGuardada(){
  try { var p = JSON.parse(lsGet(LS_PAR) || 'null'); return (p && p.c) ? String(p.c) : ''; }
  catch(e){ return ''; }
}

/* ---------- Vistas ---------- */
function ver(cual){
  el.cargando.classList.toggle('ver', cual === 'cargando');
  el.puerta.classList.toggle('ver', cual === 'puerta');
  el.vacio.classList.toggle('ver', cual === 'vacio');
  el.muro.classList.toggle('ver', cual === 'muro');
  el.pie.classList.toggle('ver', cual === 'muro' || cual === 'vacio');
  if (cual === 'puerta') setTimeout(function(){ try{ el.clave.focus(); }catch(e){} }, 80);
}

function linea(txt){
  el.linea.textContent = txt;
  el.linea.classList.add('visible');
}

/* ---------- Datos ----------
   Regla v2: un libro existe SOLO si tiene al menos un evento
   'estrella'. Releidas huerfanas (sin estrella madre) se ignoran:
   asi los fantasmas de datos son matematicamente imposibles. */
function agrupar(filas){
  var mapa = {};
  var orden = [];
  for (var i = 0; i < filas.length; i++) {
    var f = filas[i];
    if (!f || !f.slug) continue;
    var llave = (f.catalogo || 'adulto') + ':' + f.slug;
    if (!mapa[llave]) {
      mapa[llave] = { slug: f.slug, catalogo: f.catalogo || 'adulto', titulo: '', portada: '', ts: '', dorada: false, madre: false };
      orden.push(llave);
    }
    var n = mapa[llave];
    if (f.evento === 'estrella') {
      n.madre = true;
      if (!n.ts) n.ts = f.ts;
      if (f.titulo) n.titulo = f.titulo;
      if (f.portada) n.portada = f.portada;
    }
    if (f.evento === 'releida') n.dorada = true;
    if (!n.titulo && f.titulo) n.titulo = f.titulo;
    if (!n.portada && f.portada) n.portada = f.portada;
  }
  var nodos = [];
  for (var j = 0; j < orden.length; j++) {
    var nd = mapa[orden[j]];
    if (nd.madre) nodos.push(nd);
  }
  nodos.sort(function(a, b){ return String(b.ts).localeCompare(String(a.ts)); });
  return nodos;
}

function pedirEspiral(clave, cb){
  var cuerpo = new URLSearchParams();
  cuerpo.append('accion', 'espiral');
  cuerpo.append('clave', clave);
  fetch(EXEC, { method: 'POST', body: cuerpo })
    .then(function(r){ return r.json(); })
    .then(function(r){ cb(null, r); })
    .catch(function(e){ cb(e, null); });
}

/* ---------- Muro de laminas ---------- */
var observador = null;
function vigilar(){
  if (observador) return observador;
  observador = new IntersectionObserver(function(entradas){
    for (var i = 0; i < entradas.length; i++) {
      if (entradas[i].isIntersecting) {
        entradas[i].target.classList.add('ver');
        observador.unobserve(entradas[i].target);
      }
    }
  }, { rootMargin: '0px 0px 120px 0px' });
  return observador;
}

function rutaBase(nd){
  return (nd.catalogo === 'kids' ? '/kids/t/' : '/t/') + encodeURIComponent(nd.slug) + '/';
}

function armarLamina(nd, i){
  var div = document.createElement('div');
  div.className = 'lamina' + (nd.dorada ? ' dorada' : '');
  div.style.setProperty('--giro', ((i % 2 === 0) ? -1.1 : 1.1) + 'deg');
  div.setAttribute('role', 'button');
  div.setAttribute('aria-label', nd.titulo || nd.slug);

  var img = document.createElement('img');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  var base = rutaBase(nd);
  var intento = 0;
  img.src = base + 'tarjeta.png';
  img.onerror = function(){
    intento += 1;
    if (intento === 1) { img.src = base + 'og.png'; return; }
    var marco = document.createElement('div');
    marco.className = 'marco';
    marco.innerHTML = (nd.portada
      ? '<img class="mini" alt="" src="' + nd.portada.replace(/"/g, '&quot;') + '">'
      : '') + '<div class="mt"></div>';
    marco.querySelector('.mt').textContent = nd.titulo || nd.slug;
    div.replaceChild(marco, img);
  };
  div.appendChild(img);

  if (nd.dorada) {
    var sello = document.createElement('span');
    sello.className = 'sello';
    sello.textContent = '\u2726 RELE\u00cdDA';
    div.appendChild(sello);
  }

  div.addEventListener('click', function(){ releerYNavegar(nd, rutaBase(nd)); });
  return div;
}

function pintar(){
  var nodos = estado.nodos;
  el.muroInner.innerHTML = '';

  linea('Hola' + (estado.nombre ? ', ' + estado.nombre : '') + ' \u00b7 ' +
        nodos.length + (nodos.length === 1 ? ' estrella' : ' estrellas'));

  if (nodos.length === 0) { ver('vacio'); return; }
  ver('muro');

  var ob = vigilar();
  for (var i = 0; i < nodos.length; i++) {
    var lam = armarLamina(nodos[i], i);
    el.muroInner.appendChild(lam);
    ob.observe(lam);
  }
}

/* Registrar la relectura un instante antes de navegar.
   Si la red falla o tarda, leer SIEMPRE gana (tope 600 ms). */
function releerYNavegar(nd, url){
  var cuerpo = new URLSearchParams();
  cuerpo.append('accion', 'marcar');
  cuerpo.append('clave', estado.clave);
  cuerpo.append('slug', nd.slug);
  cuerpo.append('catalogo', nd.catalogo);
  cuerpo.append('evento', 'releida');
  cuerpo.append('titulo', nd.titulo || '');
  cuerpo.append('portada', nd.portada || '');

  var listo = false;
  function irse(){ if (!listo) { listo = true; window.location.href = url; } }
  try {
    fetch(EXEC, { method: 'POST', body: cuerpo, keepalive: true })
      .then(irse)['catch'](irse);
  } catch(e){ irse(); }
  setTimeout(irse, 600);
}

/* ---------- Arranque ---------- */
function fallo(mensaje){
  ver('puerta');
  el.puertaErr.textContent = mensaje || '';
}

function cargarConClave(clave, esNueva){
  estado.clave = clave;
  pedirEspiral(clave, function(err, r){
    if (err) {
      var cache = null;
      try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
      if (cache && cache.nodos) {
        estado.nombre = cache.nombre || '';
        estado.nodos = cache.nodos;
        pintar();
        linea('Sin conexi\u00f3n · mostrando tu \u00faltima espiral');
        return;
      }
      fallo('Sin conexi\u00f3n. Intenta de nuevo.');
      return;
    }
    if (!r || r.ok !== true) {
      lsDel(LS_PAR);
      fallo(r && r.error === 'clave' ? 'Clave no reconocida.' : 'Algo fall\u00f3. Intenta de nuevo.');
      return;
    }
    if (esNueva) lsSet(LS_PAR, JSON.stringify({ c: clave }));
    estado.nombre = r.nombre || '';
    estado.nodos = agrupar(r.estrellas || []);
    lsSet(LS_CACHE, JSON.stringify({ nombre: estado.nombre, nodos: estado.nodos, ts: Date.now() }));
    pintar();
  });
}

el.entrar.addEventListener('click', function(){
  var c = (el.clave.value || '').trim();
  if (c.length < 6) { el.puertaErr.textContent = 'Esa clave se ve corta.'; return; }
  el.puertaErr.textContent = '';
  ver('cargando');
  cargarConClave(c, true);
});
el.clave.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') el.entrar.click(); });

el.cambiar.addEventListener('click', function(ev){
  ev.preventDefault();
  lsDel(LS_PAR);
  el.clave.value = '';
  fallo('');
});

(function inicio(){
  var c = claveGuardada();
  if (!c) { ver('puerta'); return; }
  var cache = null;
  try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
  if (cache && cache.nodos && cache.nodos.length) {
    estado.nombre = cache.nombre || '';
    estado.nodos = cache.nodos;
    pintar();
  } else {
    ver('cargando');
  }
  cargarConClave(c, false);
})();
</script>
</body>
</html>
