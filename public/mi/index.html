<!doctype html>
<html lang="es" style="background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tu espiral · Triggui</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TRIGGUI ESPIRAL · Portal /mi · v5.0.0 "Tablero Elite"
   Grid denso (Tetris real) + Container Queries (legibilidad por
   proporción) + piel de bloque calcada célula a célula del
   organismo original + aurora heredada que respira.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  background: #000 !important;
  color: #fff;
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

vercel-live-feedback,[data-vercel-toolbar],#__vercel_live_token,vercel-toolbar{display:none!important;height:0!important;overflow:hidden!important;}

/* Aurora heredada del organismo (body::before del index),
   con una respiración lentísima añadida encima. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(40, 100, 220, 0.22), transparent 65%),
    radial-gradient(ellipse at 70% 80%, rgba(80, 230, 200, 0.11), transparent 65%);
  z-index: 0;
  pointer-events: none;
  opacity: 0.9;
}
/* Aurora cromatica: blobs vivos, familia de la barra magica.
   Blob 1 calcado (rgba 40,100,220 al .45, deriva 22s). */
.aurora-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  z-index: 0;
  will-change: transform;
}
.aurora-1 {
  width: 52vmax; height: 52vmax;
  left: -14vmax; top: -16vmax;
  background: var(--au1, rgba(40, 100, 220, 0.45));
  animation: aurora-drift-1 22s ease-in-out infinite;
}
.aurora-2 {
  width: 44vmax; height: 44vmax;
  right: -12vmax; bottom: -14vmax;
  background: var(--au2, rgba(80, 230, 200, 0.32));
  animation: aurora-drift-2 27s ease-in-out infinite;
}
.aurora-3 {
  width: 38vmax; height: 38vmax;
  left: 30vw; top: 46vh;
  background: var(--au3, rgba(140, 90, 235, 0.22));
  animation: aurora-drift-3 31s ease-in-out infinite;
}
@keyframes aurora-drift-1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(9vmax, 7vmax) scale(1.12); }
}
@keyframes aurora-drift-2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-8vmax, -6vmax) scale(1.1); }
}
@keyframes aurora-drift-3 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-6vmax, 8vmax) scale(0.94); }
}

/* ---------- Barra de marca ---------- */
#barra {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 55;
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px 0 16px;
  pointer-events: none;
}
#barra.ver { display: flex; }
#barra .marca { height: 21px; width: auto; opacity: .95; filter: invert(1) brightness(1.45); }
#barra .lado {
  display: flex;
  align-items: baseline;
  gap: 12px;
  pointer-events: auto;
}
#barra .quien {
  font-family: 'Poppins', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: .02em;
  color: rgba(255,255,255,.85);
}


/* ---------- Tablero: Tetris de grid denso ---------- */
#tablero {
  position: fixed;
  z-index: 1;
  inset: 0;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 66px 12px calc(28px + env(safe-area-inset-bottom, 0px));
}
#tablero::-webkit-scrollbar { display: none; }
#tablero.ver { display: block; }

#tableroInner {
  --gap: 12px;
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 34px;
}

.pin {
  position: relative;
  border-radius: 24px;
  opacity: 0;
  transform: translateY(14px) scale(.99);
  transition: opacity .6s cubic-bezier(0.19,1,0.22,1), transform .6s cubic-bezier(0.19,1,0.22,1);
}
.pin.ver { opacity: 1; transform: translateY(0) scale(1); }

/* Reparto exacto: la tarjeta define la altura del lienzo y la
   columna vecina reparte esa altura entre sus piezas (1fr cada
   una). Cero aproximaciones, cero huecos, en cualquier pantalla. */
.lienzo {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}
/* Rejilla de ranuras: 2 por fila. Cada pieza ocupa 1 o 2 segun
   el escenario; la paridad garantiza cero medias-filas huerfanas. */
.mini, .rejilla {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.s1 { grid-column: span 1; aspect-ratio: 1 / 1; }
.s2 { grid-column: span 2; aspect-ratio: 2 / 1; }
.f-tarjeta { width: 100%; }

@media (min-width: 900px) {
  .lienzo {
    --tw: 440px;
    display: grid;
    grid-template-columns: var(--tw) 1fr;
    grid-template-rows: repeat(var(--filas, 4), minmax(0, 1fr));
    height: calc(var(--tw) * 1.77778);
    align-items: stretch;
    gap: var(--gap);
  }
  .pin-tarjeta { height: 100%; overflow: hidden; }
  .pin-tarjeta img { height: 100%; width: auto; max-width: 100%; margin: 0 auto; }
  .f-tarjeta { grid-column: 1; grid-row: 1 / -1; }
  .mini { grid-column: 2; grid-row: 1; min-height: 0; }
  .rejilla {
    grid-column: 2;
    grid-row: 2 / -1;
  }
  .lienzo.sin-mini .rejilla {
    grid-row: 1 / -1;
    grid-template-rows: repeat(var(--filasR, 1), minmax(0, 1fr));
    min-height: 0;
  }
  .s1, .s2 { aspect-ratio: auto; height: 100%; min-height: 0; overflow: hidden; }
}

.pin-og {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 12, 17, .55);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 24px;
  padding: 6px;
}
.pin-og img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 12px 32px rgba(0,0,0,.4);
  display: block;
  pointer-events: none;
}

/* Cabecera de combo: titulo + chip de autor (chip calcado del organismo) */
.pin-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 18px 4px 6px;
}
.pin-head .titulo {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(17px, 4.4vw, 25px);
  color: rgba(255,255,255,.95);
  line-height: 1.15;
}
.pin-head .chip {
  display: inline-block;
  font-family: 'Archivo', sans-serif;
  font-size: 13px;
  line-height: 1;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 12px;
  letter-spacing: 0.3px;
}

/* ---------- Pin tarjeta (la obra, proporción intacta sobre el cielo) ---------- */
.pin-tarjeta img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.13);
  box-shadow: 0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.5);
  pointer-events: none;
}
.pin-tarjeta.dorada img {
  border-color: rgba(246,196,83,.85);
  box-shadow: 0 0 0 1.5px rgba(246,196,83,.38), 0 0 34px rgba(246,196,83,.22), 0 30px 70px rgba(0,0,0,.5);
}
.pin-tarjeta { cursor: pointer; }

/* ---------- Pin og: proporcion exacta, cero recortes ---------- */
.pin-og {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 12, 17, .55);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 24px;
  padding: 6px;
}
.pin-og img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 12px 32px rgba(0,0,0,.4);
  display: block;
  pointer-events: none;
}

/* ---------- Pin bloque: piel calcada célula a célula ---------- */
.pin-bloque {
  container-type: size;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  border-radius: 24px;
  font-weight: 700;
  cursor: pointer;
  background-size: 320% 320%;
  background-position: center;
  transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity .6s cubic-bezier(0.19,1,0.22,1);
  overflow: hidden;
  isolation: isolate;
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.15),
    0 4px 6px rgba(0,0,0,.15),
    0 12px 32px rgba(0,0,0,.35);
}
.pin-bloque::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(145deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.08) 40%, transparent 100%);
  z-index: 1;
  pointer-events: none;
}
.pin-bloque::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12), transparent 60%);
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 0;
  pointer-events: none;
}
@media (hover: hover) {
  .pin-bloque:hover::after { opacity: 1; }
  .pin-bloque:hover {
    transform: translateY(-2px) scale(1.005);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(0,0,0,.16),
      inset 0 0 0 1px rgba(255,255,255,.16),
      0 3px 7px rgba(0,0,0,.14),
      0 18px 46px rgba(0,0,0,.42);
  }
}
.pin-bloque:active {
  transform: translateY(0) scale(0.995);
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}

.pin-bloque .cara {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  z-index: 2;
  text-align: center;
  transition: opacity 0.25s ease, transform 0.25s ease;
  -webkit-font-smoothing: antialiased;
}
.pin-bloque .cara.palabra {
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 700;
  font-size: clamp(15px, 13cqw, 31px);
  letter-spacing: .005em;
  line-height: 1.12;
}
.pin-bloque .cara.frase {
  font-family: 'Archivo', sans-serif;
  font-weight: 500;
  font-size: clamp(12px, 6.6cqw, 16.5px);
  line-height: 1.45;
  opacity: 0;
  transform: scale(.97);
  padding: 1rem 1.05rem 1.5rem;
  overflow-y: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 98%);
  mask-image: linear-gradient(180deg, #000 78%, transparent 98%);
}
.pin-bloque .cara.frase::-webkit-scrollbar { display: none; }
.pin-bloque .cara.frase .fx { margin: auto; }
.pin-bloque.volteada .cara.palabra { opacity: 0; transform: scale(.97); }
.pin-bloque.volteada .cara.frase { opacity: 1; transform: scale(1); }
.pin-bloque .puntos {
  position: absolute;
  bottom: 11px;
  left: 0;
  right: 0;
  display: flex;
  gap: 5px;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}
.pin-bloque .puntos i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: .3;
  transition: opacity .3s ease;
}
.pin-bloque .puntos i.on { opacity: .9; }

/* ---------- Pin nota: vidrio sobre la aurora ---------- */
.pin-nota {
  container-type: size;
  border-radius: 24px;
  padding: clamp(16px, 8cqh, 30px) clamp(18px, 6cqw, 34px);
  cursor: pointer;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 32px rgba(0,0,0,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}
.pin-nota .texto {
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 300;
  font-size: clamp(16px, 10.5cqh, 30px);
  line-height: 1.32;
  letter-spacing: -0.4px;
  color: #fff;
  max-width: 86%;
  position: relative;
  padding-bottom: 12px;
}
.pin-nota .texto::after {
  content: "";
  position: absolute;
  left: 22%;
  right: 22%;
  bottom: 0;
  height: 1px;
  opacity: .6;
  background: linear-gradient(90deg, transparent, var(--linea, #E35D30), transparent);
}

/* ---------- Menú de tres puntos ---------- */
.tres {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: rgba(8,8,12,.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: rgba(255,255,255,.92);
  font-size: 14px;
  line-height: 28px;
  cursor: pointer;
  z-index: 6;
  padding: 0;
  opacity: 0;
  transition: opacity .25s ease;
}
.pin:hover .tres, .menu.ver + .tres { opacity: 1; }
@media (hover: none) { .tres { opacity: .85; } }
.menu {
  position: absolute;
  top: 42px;
  right: 9px;
  z-index: 7;
  background: rgba(13,13,19,.98);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 14px;
  overflow: hidden;
  min-width: 164px;
  display: none;
  box-shadow: 0 18px 44px rgba(0,0,0,.6);
}
.menu.ver { display: block; }
.menu button, .menu a {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: rgba(255,255,255,.9);
  font-family: 'Poppins', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  padding: 11px 15px;
  cursor: pointer;
  text-decoration: none;
}
.menu button:active, .menu a:active { background: rgba(255,255,255,.08); }
.menu .peligro { color: #ff9d9d; }

/* ---------- Tooltip de primera vez ---------- */
#tip {
  position: fixed;
  left: 50%;
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px);
  z-index: 60;
  background: rgba(13,13,19,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(227,93,48,.55);
  border-radius: 14px;
  padding: 10px 36px 10px 15px;
  font-family: 'Poppins', sans-serif;
  font-size: 12px;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  transition: opacity .5s ease, transform .5s ease;
  max-width: 84vw;
}
#tip.ver { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#tip .x {
  position: absolute;
  top: 4px;
  right: 6px;
  background: none;
  border: none;
  color: rgba(255,255,255,.6);
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
}

/* ---------- Vacío y carga ---------- */
.centro-msg {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 36px;
  z-index: 5;
}
.centro-msg.ver { display: flex; }
.esp-glifo { width: 54px; height: 54px; margin-bottom: 22px; opacity: .9; }
.centro-msg .t1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(20px, 5.4vw, 27px);
  color: rgba(255,255,255,.92);
  margin: 0 0 10px;
}
.centro-msg .t2 {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(13px, 3.6vw, 15px);
  font-weight: 500;
  line-height: 1.55;
  color: rgba(255,255,255,.5);
  margin: 0;
  max-width: 340px;
}
.loading-text { animation: breatheLoading 1.5s infinite ease-in-out; color: rgba(255,255,255,0.5); font-size: 15px; letter-spacing: 1.5px; font-family: 'Poppins', sans-serif; }
@keyframes breatheLoading { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

/* ---------- Puerta (clave) ---------- */
#puerta {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  z-index: 10;
}
#puerta.ver { display: flex; }
.puerta-card {
  width: 100%;
  max-width: 340px;
  background: rgba(12,12,18,.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 20px;
  padding: 30px 24px 24px;
  text-align: center;
}
.puerta-card img.marca { height: 21px; width: auto; opacity: .95; margin-bottom: 18px; filter: invert(1) brightness(1.45); }
.puerta-card h1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 24px;
  margin: 0 0 6px;
  color: #fff;
}
.puerta-card p.sub {
  font-family: 'Poppins', sans-serif;
  font-size: 12.5px;
  color: rgba(255,255,255,.55);
  margin: 0 0 18px;
  line-height: 1.5;
}
.puerta-card input {
  width: 100%;
  padding: 13px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.06);
  color: #fff;
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  text-align: center;
  letter-spacing: .14em;
  outline: none;
}
.puerta-card input:focus { border-color: rgba(227,93,48,.7); }
.puerta-err { min-height: 18px; font-size: 12px; color: #ff9d9d; margin: 9px 0 3px; font-family: 'Poppins', sans-serif; }
.puerta-card button {
  width: 100%;
  padding: 13px 0;
  border-radius: 12px;
  border: 1px solid rgba(227,93,48,.65);
  background: rgba(227,93,48,.16);
  color: #fff;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .2s ease, background .2s ease;
}
.puerta-card button:active { transform: scale(.97); }
.puerta-pie { margin-top: 16px; font-size: 11px; font-family: 'Poppins', sans-serif; }
.puerta-pie a { color: rgba(255,255,255,.5); text-decoration: underline; }
</style>
</head>
<body>

<div class="aurora-blob aurora-1"></div>
<div class="aurora-blob aurora-2"></div>
<div class="aurora-blob aurora-3"></div>

<div id="barra">
  <img class="marca" src="https://raw.githubusercontent.com/badirnakid/triggui-app/main/public/trigguiletras2.png" alt="Triggui">
  <div class="lado">
    <span class="quien" id="quien"></span>
  </div>
</div>

<div id="cargando" class="centro-msg ver">
  <span class="loading-text">Abriendo tu espiral...</span>
</div>

<div id="puerta">
  <div class="puerta-card">
    <img class="marca" src="https://raw.githubusercontent.com/badirnakid/triggui-app/main/public/trigguiletras2.png" alt="Triggui">
    <h1>Tu espiral</h1>
    <p class="sub">El lugar donde viven los libros que te han tocado.</p>
    <input id="clave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tu clave de miembro">
    <div class="puerta-err" id="puertaErr"></div>
    <button id="entrar" type="button">Entrar</button>
    <div class="puerta-pie"><a href="https://triggui.com" target="_blank" rel="noopener">¿Aún no eres miembro?</a></div>
  </div>
</div>

<div id="vacio" class="centro-msg">
  <svg class="esp-glifo" viewBox="0 0 24 24" fill="none" stroke="#E35D30" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12.6 12.2 a2.6 2.6 0 1 1 -2.6 2.6 a5.2 5.2 0 1 1 5.2 -5.2 a8.2 8.2 0 1 1 -8.4 8.3"/></svg>
  <p class="t1">Tu espiral está lista.</p>
  <p class="t2">Cuando marques un libro que te llegue, aquí nacerá su colección de piezas: palabras, frases y tarjetas creciendo contigo.</p>
</div>

<div id="tablero"><div id="tableroInner"></div></div>

<div id="tip"><button class="x" id="tipX" aria-label="Cerrar">&times;</button><span id="tipTxt"></span></div>

<script>
'use strict';

var EXEC = 'https://script.google.com/macros/s/AKfycbwWcUceg333PMcmSsLbEUAsx3os8AJ3Wdmjruv7zshHTqNmoxTastOsDU1h7V8qPk0nIQ/exec';
var LS_PAR = 'triggui_espiral_v1';
var LS_CACHE = 'triggui_espiral_cache_v2';
var LS_TIP = 'triggui_tip_flip_v1';

function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }

var el = {
  barra: document.getElementById('barra'),
  quien: document.getElementById('quien'),
  cargando: document.getElementById('cargando'),
  puerta: document.getElementById('puerta'),
  puertaErr: document.getElementById('puertaErr'),
  clave: document.getElementById('clave'),
  entrar: document.getElementById('entrar'),
  vacio: document.getElementById('vacio'),
  tablero: document.getElementById('tablero'),
  inner: document.getElementById('tableroInner'),
  tip: document.getElementById('tip'),
  tipTxt: document.getElementById('tipTxt'),
  tipX: document.getElementById('tipX'),
};

var estado = { nombre: '', filas: [], clave: '' };
var ultimaFirma = '';
var primeraPintura = true;
// Semilla de la visita: el azar se decide UNA vez por carga.
// Cache y red pintan identico; entre visitas cambia.
var SEMILLA = (Math.random() * 2147483647) | 0;
function _prng(n){
  var t = (SEMILLA + n) >>> 0;
  return function(){
    t += 0x6D2B79F5;
    var r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function _hashSlug(s){
  var h = 0;
  for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return h >>> 0;
}
var menuAbierto = null;

/* ---------- Link magico #k= ---------- */
(function magia(){
  var h = String(window.location.hash || '');
  var m = h.match(/[#&]k=([^&]+)/);
  if (m && m[1]) {
    lsSet(LS_PAR, JSON.stringify({ c: decodeURIComponent(m[1]).trim() }));
    try { history.replaceState(null, '', window.location.pathname); } catch(e){}
  }
})();

function claveGuardada(){
  try { var p = JSON.parse(lsGet(LS_PAR) || 'null'); return (p && p.c) ? String(p.c) : ''; }
  catch(e){ return ''; }
}

/* ---------- Vistas ---------- */
function ver(cual){
  el.cargando.classList.toggle('ver', cual === 'cargando');
  el.puerta.classList.toggle('ver', cual === 'puerta');
  el.vacio.classList.toggle('ver', cual === 'vacio');
  el.tablero.classList.toggle('ver', cual === 'tablero');
  el.barra.classList.toggle('ver', cual === 'tablero' || cual === 'vacio');
  if (cual === 'puerta') setTimeout(function(){ try{ el.clave.focus(); }catch(e){} }, 80);
}

/* ---------- Datos ----------
   Piezas: un libro existe si tiene evento estrella o combo.
   El payload del combo trae palabras/frases/colores/textColors/
   bocado/eco copiados del origen. Los eventos quitar filtran
   componentes; quitar "todo" retira la pieza completa. */
function agrupar(filas){
  var mapa = {};
  var orden = [];
  for (var i = 0; i < filas.length; i++) {
    var f = filas[i];
    if (!f || !f.slug) continue;
    var llave = (f.catalogo || 'adulto') + ':' + f.slug;
    if (!mapa[llave]) {
      mapa[llave] = { slug: f.slug, catalogo: f.catalogo || 'adulto', titulo: '', portada: '',
                      ts: '', tsMadre: '', dorada: false, madre: false, payload: null, fueraTs: {} };
      orden.push(llave);
    }
    var n = mapa[llave];
    if (f.evento === 'estrella' || f.evento === 'combo') {
      n.madre = true;
      if (!n.ts) n.ts = f.ts;
      if (String(f.ts) > String(n.tsMadre)) n.tsMadre = f.ts;
      if (f.titulo) n.titulo = f.titulo;
      if (f.portada) n.portada = f.portada;
      if (f.evento === 'combo' && f.payload) {
        try { n.payload = JSON.parse(f.payload); } catch(e){}
      }
    }
    if (f.evento === 'releida') n.dorada = true;
    if (f.evento === 'quitar' && f.componente) {
      if (!n.fueraTs[f.componente] || String(f.ts) > String(n.fueraTs[f.componente])) n.fueraTs[f.componente] = f.ts;
    }
    if (!n.titulo && f.titulo) n.titulo = f.titulo;
    if (!n.portada && f.portada) n.portada = f.portada;
  }
  var piezas = [];
  for (var j = 0; j < orden.length; j++) {
    var nd = mapa[orden[j]];
    nd.fuera = {};
    for (var c in nd.fueraTs) {
      if (String(nd.fueraTs[c]) > String(nd.tsMadre)) nd.fuera[c] = true;
    }
    if (nd.madre && !nd.fuera['todo']) piezas.push(nd);
  }
  piezas.sort(function(a, b){ return String(b.ts).localeCompare(String(a.ts)); });
  return piezas;
}

function pedirEspiral(clave, cb){
  var cuerpo = new URLSearchParams();
  cuerpo.append('accion', 'espiral');
  cuerpo.append('clave', clave);
  fetch(EXEC, { method: 'POST', body: cuerpo })
    .then(function(r){ return r.json(); })
    .then(function(r){ cb(null, r); })
    .catch(function(e){ cb(e, null); });
}

/* ---------- Navegar registrando la relectura (leer siempre gana) ---------- */
function rutaBase(pz){
  return (pz.catalogo === 'kids' ? '/kids/t/' : '/t/') + encodeURIComponent(pz.slug) + '/';
}

function releerYNavegar(pz){
  var cuerpo = new URLSearchParams();
  cuerpo.append('accion', 'marcar');
  cuerpo.append('clave', estado.clave);
  cuerpo.append('slug', pz.slug);
  cuerpo.append('catalogo', pz.catalogo);
  cuerpo.append('evento', 'releida');
  cuerpo.append('titulo', pz.titulo || '');
  cuerpo.append('portada', pz.portada || '');
  var url = rutaBase(pz);
  var listo = false;
  function irse(){ if (!listo) { listo = true; window.location.href = url; } }
  try {
    fetch(EXEC, { method: 'POST', body: cuerpo, keepalive: true })
      .then(irse)['catch'](irse);
  } catch(e){ irse(); }
  setTimeout(irse, 600);
}

/* ---------- Quitar (curaduria append-only) ---------- */
function quitar(pz, componente, pinEl){
  var cuerpo = new URLSearchParams();
  cuerpo.append('accion', 'quitar');
  cuerpo.append('clave', estado.clave);
  cuerpo.append('slug', pz.slug);
  cuerpo.append('catalogo', pz.catalogo);
  cuerpo.append('componente', componente);
  // Optimista: la pieza se va AL INSTANTE; el registro viaja en segundo plano.
  estado.filas.push({ slug: pz.slug, catalogo: pz.catalogo, evento: 'quitar', componente: componente, ts: new Date().toISOString(), titulo:'', portada:'', payload:'' });
  lsSet(LS_CACHE, JSON.stringify({ nombre: estado.nombre, filas: estado.filas, ts: Date.now() }));
  if (componente === 'todo') { ultimaFirma = ''; pintar(); }
  else if (pinEl) {
    pinEl.style.transition = 'opacity .35s ease, transform .35s ease';
    pinEl.style.opacity = '0';
    pinEl.style.transform = 'scale(.94)';
    setTimeout(function(){ pinEl.remove(); }, 360);
  }
  fetch(EXEC, { method: 'POST', body: cuerpo }).catch(function(){});
}

/* ---------- Menu de tres puntos ---------- */
function cerrarMenus(){
  if (menuAbierto) { menuAbierto.classList.remove('ver'); menuAbierto = null; }
}
document.addEventListener('click', function(ev){
  if (!ev.target.closest('.menu') && !ev.target.closest('.tres')) cerrarMenus();
});

function armarMenu(pz, componente, pinEl, descargaUrl, descargaOgUrl){
  var tres = document.createElement('button');
  tres.className = 'tres';
  tres.setAttribute('aria-label', 'Opciones');
  tres.textContent = '\u22ef';

  var menu = document.createElement('div');
  menu.className = 'menu';

  var abrir = document.createElement('button');
  abrir.textContent = 'Abrir edici\u00f3n viva';
  abrir.addEventListener('click', function(ev){ ev.stopPropagation(); cerrarMenus(); releerYNavegar(pz); });
  menu.appendChild(abrir);

  if (descargaUrl) {
    var desc = document.createElement('a');
    desc.textContent = 'Descargar PNG';
    desc.href = descargaUrl;
    desc.setAttribute('download', pz.slug + '-' + componente + '.png');
    desc.addEventListener('click', function(ev){ ev.stopPropagation(); cerrarMenus(); });
    menu.appendChild(desc);
  }
  if (descargaOgUrl) {
    var descOg = document.createElement('a');
    descOg.textContent = 'Descargar OG';
    descOg.href = descargaOgUrl;
    descOg.setAttribute('download', pz.slug + '-og.png');
    descOg.addEventListener('click', function(ev){ ev.stopPropagation(); cerrarMenus(); });
    menu.appendChild(descOg);
  }

  var quit = document.createElement('button');
  quit.className = 'peligro';
  quit.textContent = 'Quitar de mi espiral';
  var armado = false;
  quit.addEventListener('click', function(ev){
    ev.stopPropagation();
    if (!armado) { armado = true; quit.textContent = '\u00bfSeguro? Quitar'; return; }
    cerrarMenus();
    quitar(pz, componente, pinEl);
  });
  menu.appendChild(quit);

  tres.addEventListener('click', function(ev){
    ev.stopPropagation();
    var abierto = menu.classList.contains('ver');
    cerrarMenus();
    if (!abierto) { menu.classList.add('ver'); menuAbierto = menu; armado = false; quit.textContent = 'Quitar de mi espiral'; }
  });

  pinEl.appendChild(menu);
  pinEl.appendChild(tres);
}

/* ---------- Fabrica de pins ---------- */
function pinHead(pz){
  var div = document.createElement('div');
  div.className = 'pin pin-head f-head';
  var t = document.createElement('span');
  t.className = 'titulo';
  t.textContent = pz.titulo || pz.slug;
  div.appendChild(t);
  var autor = pz.payload && pz.payload.autor;
  if (autor) {
    var acc = (pz.payload && (pz.payload.accent || (pz.payload.colores || [])[1])) || '#E35D30';
    var ch = document.createElement('span');
    ch.className = 'chip';
    ch.style.color = acc;
    ch.style.background = acc + '24';
    ch.textContent = autor;
    div.appendChild(ch);
  }
  div.addEventListener('click', function(){ releerYNavegar(pz); });
  return div;
}

// Barajado por combo: azar fresco en cada visita, con una regla de
// hospitalidad: la tarjeta jamas abre el combo (el tablero recibe primero).
function barajar(arr, slug){
  var rnd = _prng(_hashSlug(String(slug || '')));
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  if (arr.length > 1 && arr[0] && arr[0].esTarjeta) {
    for (var k = 1; k < arr.length; k++) {
      if (arr[k] && !arr[k].esTarjeta) { var s = arr[0]; arr[0] = arr[k]; arr[k] = s; break; }
    }
  }
  return arr;
}
function pinTarjeta(pz){
  var div = document.createElement('div');
  div.className = 'pin pin-tarjeta f-tarjeta' + (pz.dorada ? ' dorada' : '');
  var img = document.createElement('img');
  img.alt = pz.titulo || pz.slug;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.src = rutaBase(pz) + 'tarjeta.png';
  img.onerror = function(){ div.remove(); };
  div.appendChild(img);
  div.addEventListener('click', function(){ releerYNavegar(pz); });
  armarMenu(pz, 'tarjeta', div, rutaBase(pz) + 'tarjeta.png', rutaBase(pz) + 'og.png');
  return div;
}

function pinBloque(pz, i){
  var pl = (pz.payload.palabras || [])[i] || '';
  var fr = (pz.payload.frases || [])[i] || '';
  var c0 = (pz.payload.colores || [])[i] || '#1a1a24';
  var c1 = (pz.payload.colores || [])[(i + 1) % 4] || c0;
  var tx = (pz.payload.textColors || [])[i] || '#ffffff';
  if (!pl) return null;

  var div = document.createElement('div');
  div.className = 'pin pin-bloque f-bloque';
  div.style.background = 'linear-gradient(135deg, ' + c0 + ', ' + c1 + ')';
  div.style.backgroundSize = '320% 320%';
  div.style.backgroundPosition = 'center';
  div.style.color = tx;

  var caraP = document.createElement('div');
  caraP.className = 'cara palabra';
  caraP.textContent = pl;
  var caraF = document.createElement('div');
  caraF.className = 'cara frase';
  var fx = document.createElement('span');
  fx.className = 'fx';
  fx.textContent = fr || pl;
  caraF.appendChild(fx);
  var puntos = document.createElement('div');
  puntos.className = 'puntos';
  puntos.innerHTML = '<i class="on"></i><i></i>';

  div.appendChild(caraP);
  div.appendChild(caraF);
  div.appendChild(puntos);

  div.addEventListener('click', function(){
    div.classList.toggle('volteada');
    var vs = puntos.children;
    var volteada = div.classList.contains('volteada');
    vs[0].classList.toggle('on', !volteada);
    vs[1].classList.toggle('on', volteada);
    marcarTipVisto();
  });

  armarMenu(pz, 'bloque' + i, div, null);
  return div;
}

function pinNota(pz, tipo){
  var texto = pz.payload[tipo];
  if (!texto) return null;
  var acc = (pz.payload.accent || (pz.payload.colores || [])[1]) || '#E35D30';
  var div = document.createElement('div');
  div.className = 'pin pin-nota f-nota';
  var tx = document.createElement('div');
  tx.className = 'texto';
  tx.style.setProperty('--linea', acc);
  tx.textContent = texto;
  div.appendChild(tx);
  div.addEventListener('click', function(){ releerYNavegar(pz); });
  armarMenu(pz, tipo, div, null);
  return div;
}

function pinOg(pz){
  var div = document.createElement('div');
  div.className = 'pin pin-og f-og';
  var img = document.createElement('img');
  img.alt = pz.titulo || pz.slug;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.src = rutaBase(pz) + 'og.png';
  img.onerror = function(){ div.remove(); };
  div.appendChild(img);
  div.addEventListener('click', function(){ releerYNavegar(pz); });
  armarMenu(pz, 'og', div, rutaBase(pz) + 'og.png');
  return div;
}

/* ---------- Pintar el tablero ---------- */
var observador = null;
function vigilar(){
  if (observador) return observador;
  observador = new IntersectionObserver(function(entradas){
    for (var i = 0; i < entradas.length; i++) {
      if (entradas[i].isIntersecting) {
        entradas[i].target.classList.add('ver');
        observador.unobserve(entradas[i].target);
      }
    }
  }, { rootMargin: '0px 0px 140px 0px' });
  return observador;
}

function hexRgba(hex, a){
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return '';
  var n = parseInt(m[1], 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

// El cielo se tine con los acentos de tus ultimos libros.
function tenirAurora(piezas){
  var acentos = [];
  for (var i = 0; i < piezas.length && acentos.length < 3; i++) {
    var pl = piezas[i].payload;
    var a = pl && (pl.accent || (pl.colores || [])[1]);
    if (a) acentos.push(a);
  }
  var raiz = document.documentElement.style;
  var alfas = [0.42, 0.30, 0.22];
  for (var j = 0; j < 3; j++) {
    var c = acentos[j] || acentos[0];
    var v = c ? hexRgba(c, alfas[j]) : '';
    if (v) raiz.setProperty('--au' + (j + 1), v); else raiz.removeProperty('--au' + (j + 1));
  }
}

function pintar(){
  var firma = JSON.stringify([estado.nombre, estado.filas]);
  if (firma === ultimaFirma) return; // nada cambio: quietud absoluta
  ultimaFirma = firma;
  var piezas = agrupar(estado.filas);
  tenirAurora(piezas);
  el.inner.innerHTML = '';
  cerrarMenus();

  el.quien.textContent = estado.nombre ? ('Hola, ' + estado.nombre) : '';

  if (piezas.length === 0) { ver('vacio'); return; }
  ver('tablero');

  var ob = vigilar();
  var hayBloques = false;

  for (var p = 0; p < piezas.length; p++) {
    var pz = piezas[p];
    // Reparto exacto: palabras barajadas entre si, anchas entre si;
    // la tarjeta ancla el lienzo y todo lo demas reparte su altura.
    var bloques = [];
    var anchas = [];
    if (pz.payload) {
      if (!pz.fuera['bloque0']) bloques.push(pinBloque(pz, 0));
      if (!pz.fuera['bloque1']) bloques.push(pinBloque(pz, 1));
      if (!pz.fuera['bloque2']) bloques.push(pinBloque(pz, 2));
      if (!pz.fuera['bloque3']) bloques.push(pinBloque(pz, 3));
      if (!pz.fuera['bocado']) anchas.push(pinNota(pz, 'bocado'));
      if (!pz.fuera['eco']) anchas.push(pinNota(pz, 'eco'));
    }
    if (!pz.fuera['og']) anchas.push(pinOg(pz));
    bloques = bloques.filter(Boolean);
    anchas = anchas.filter(Boolean);
    barajar(bloques, 'b:' + pz.slug);
    barajar(anchas, 'a:' + pz.slug);

    var lienzo = document.createElement('div');
    lienzo.className = 'lienzo';

    // El empacador: 2 ranuras por fila. Bloques ocupan 1; og y notas
    // ocupan 2 pero se ENCOGEN a 1 cuando un bloque queda solitario:
    // paridad perfecta, cero huecos, en cualquier escenario.
    function marcar(elx, ranuras){ elx.classList.add(ranuras === 1 ? 's1' : 's2'); return elx; }

    var mini = document.createElement('div');
    mini.className = 'mini';
    var restoBloques = bloques.slice();
    for (var m = 0; m < 2 && restoBloques.length; m++) mini.appendChild(marcar(restoBloques.shift(), 1));
    if (mini.children.length === 1 && anchas.length) mini.appendChild(marcar(anchas.shift(), 1));

    var rejilla = document.createElement('div');
    rejilla.className = 'rejilla';
    var filasR = 0;
    while (restoBloques.length >= 2) {
      rejilla.appendChild(marcar(restoBloques.shift(), 1));
      rejilla.appendChild(marcar(restoBloques.shift(), 1));
      filasR++;
    }
    if (restoBloques.length === 1) {
      rejilla.appendChild(marcar(restoBloques.shift(), 1));
      if (anchas.length) rejilla.appendChild(marcar(anchas.shift(), 1));
      filasR++;
    }
    while (anchas.length) { rejilla.appendChild(marcar(anchas.shift(), 2)); filasR++; }

    var conTarjeta = !pz.fuera['tarjeta'];
    var hayMini = mini.children.length > 0;
    if (hayMini) lienzo.appendChild(mini);
    if (conTarjeta) lienzo.appendChild(pinTarjeta(pz));
    if (rejilla.children.length) lienzo.appendChild(rejilla);
    if (!hayMini) lienzo.classList.add('sin-mini');

    lienzo.style.setProperty('--filas', (hayMini ? 1 : 0) + Math.max(filasR, hayMini ? 0 : 1));
    lienzo.style.setProperty('--filasR', Math.max(filasR, 1));

    var pins = [pinHead(pz), lienzo];

    hayBloques = hayBloques || bloques.length > 0;
    for (var q = 0; q < pins.length; q++) {
      if (!pins[q]) continue;
      el.inner.appendChild(pins[q]);
      var animables = pins[q].classList.contains('lienzo')
        ? pins[q].querySelectorAll('.pin')
        : [pins[q]];
      for (var w = 0; w < animables.length; w++) {
        if (primeraPintura) ob.observe(animables[w]);
        else animables[w].classList.add('ver');
      }
    }
  }

  primeraPintura = false;

  if (hayBloques && !lsGet(LS_TIP)) {
    el.tipTxt.textContent = 'Toca una palabra para voltear su frase';
    el.tip.classList.add('ver');
  }
}

function marcarTipVisto(){
  if (!lsGet(LS_TIP)) { lsSet(LS_TIP, '1'); el.tip.classList.remove('ver'); }
}
el.tipX.addEventListener('click', marcarTipVisto);

/* ---------- Arranque ---------- */
function fallo(mensaje){
  ver('puerta');
  el.puertaErr.textContent = mensaje || '';
}

function cargarConClave(clave, esNueva){
  estado.clave = clave;
  pedirEspiral(clave, function(err, r){
    if (err) {
      var cache = null;
      try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
      if (cache && cache.filas) {
        estado.nombre = cache.nombre || '';
        estado.filas = cache.filas;
        pintar();
        return;
      }
      fallo('Sin conexi\u00f3n. Intenta de nuevo.');
      return;
    }
    if (!r || r.ok !== true) {
      lsDel(LS_PAR);
      fallo(r && r.error === 'clave' ? 'Clave no reconocida.' : 'Algo fall\u00f3. Intenta de nuevo.');
      return;
    }
    if (esNueva) lsSet(LS_PAR, JSON.stringify({ c: clave }));
    estado.nombre = r.nombre || '';
    estado.filas = r.estrellas || [];
    lsSet(LS_CACHE, JSON.stringify({ nombre: estado.nombre, filas: estado.filas, ts: Date.now() }));
    pintar();
  });
}

el.entrar.addEventListener('click', function(){
  var c = (el.clave.value || '').trim();
  if (c.length < 6) { el.puertaErr.textContent = 'Esa clave se ve corta.'; return; }
  el.puertaErr.textContent = '';
  ver('cargando');
  cargarConClave(c, true);
});
el.clave.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') el.entrar.click(); });

(function inicio(){
  var c = claveGuardada();
  if (!c) { ver('puerta'); return; }
  var cache = null;
  try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
  if (cache && cache.filas && cache.filas.length) {
    estado.nombre = cache.nombre || '';
    estado.filas = cache.filas;
    pintar();
  } else {
    ver('cargando');
  }
  cargarConClave(c, false);
})();
</script>
