<!doctype html>
<html lang="es" style="background:#000;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" id="temaColor" content="#000000">
<title>Tu espiral · Triggui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TRIGGUI ESPIRAL · Portal /mi · v5.0.0 "Tablero Elite"
   Grid denso (Tetris real) + Container Queries (legibilidad por
   proporción) + piel de bloque calcada célula a célula del
   organismo original + aurora heredada que respira.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  background: #000 !important;
  color: #fff;
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

vercel-live-feedback,[data-vercel-toolbar],#__vercel_live_token,vercel-toolbar{display:none!important;height:0!important;overflow:hidden!important;}

/* Aurora heredada del organismo (body::before del index),
   con una respiración lentísima añadida encima. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(40, 100, 220, 0.22), transparent 65%),
    radial-gradient(ellipse at 70% 80%, rgba(80, 230, 200, 0.11), transparent 65%);
  z-index: 0;
  pointer-events: none;
  opacity: 0.9;
}
/* Aurora cromatica: blobs vivos, familia de la barra magica.
   Blob 1 calcado (rgba 40,100,220 al .45, deriva 22s). */
.aurora-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  z-index: 0;
  will-change: transform;
  transition: background 1.4s ease;
}
.aurora-1 {
  width: 52vmax; height: 52vmax;
  left: -14vmax; top: -16vmax;
  background: var(--au1, rgba(40, 100, 220, 0.45));
  animation: aurora-drift-1 22s ease-in-out infinite;
}
.aurora-2 {
  width: 44vmax; height: 44vmax;
  right: -12vmax; bottom: -14vmax;
  background: var(--au2, rgba(80, 230, 200, 0.32));
  animation: aurora-drift-2 27s ease-in-out infinite;
}
.aurora-3 {
  width: 38vmax; height: 38vmax;
  left: 30vw; top: 46vh;
  background: var(--au3, rgba(140, 90, 235, 0.22));
  animation: aurora-drift-3 31s ease-in-out infinite;
}
@keyframes aurora-drift-1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(9vmax, 7vmax) scale(1.12); }
}
@keyframes aurora-drift-2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-8vmax, -6vmax) scale(1.1); }
}
@keyframes aurora-drift-3 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-6vmax, 8vmax) scale(0.94); }
}

/* ---------- Barra de marca ---------- */
#barra {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 55;
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px 0 16px;
  pointer-events: none;
}
#barra.ver { display: flex; }
#barra .marca { height: 21px; width: auto; opacity: .95; filter: invert(1) brightness(1.45); }
#barra .chipb {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 12px;
  background: var(--chipb, rgba(8, 10, 14, .28));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
#barra .lado {
  display: flex;
  align-items: baseline;
  gap: 12px;
  pointer-events: auto;
}
#barra .quien {
  font-family: 'Poppins', sans-serif;
  font-size: 14.5px;
  font-weight: 500;
  letter-spacing: .02em;
  color: rgba(255,255,255,.88);
  max-width: min(46vw, 240px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* ---------- Tablero: Tetris de grid denso ---------- */
#tablero {
  position: fixed;
  z-index: 1;
  overscroll-behavior-y: contain;
  inset: 0;
  display: none;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 66px 12px calc(28px + env(safe-area-inset-bottom, 0px));
}
#tablero::-webkit-scrollbar { display: none; }
#tablero.ver { display: block; }

#tableroInner {
  --gap: 12px;
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 34px;
}

.pin {
  position: relative;
  border-radius: 24px;
  opacity: 0;
  transform: translateY(14px) scale(.99);
  transition: opacity .6s cubic-bezier(0.19,1,0.22,1), transform .6s cubic-bezier(0.19,1,0.22,1);
}
.pin.ver { opacity: 1; transform: translateY(0) scale(1); }
.pin.encima { z-index: 60; }

/* Reparto exacto: la tarjeta define la altura del lienzo y la
   columna vecina reparte esa altura entre sus piezas (1fr cada
   una). Cero aproximaciones, cero huecos, en cualquier pantalla. */
.lienzo {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}
/* Rejilla de ranuras: 2 por fila. Cada pieza ocupa 1 o 2 segun
   el escenario; la paridad garantiza cero medias-filas huerfanas. */
.mini, .rejilla {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.s1 { grid-column: span 1; aspect-ratio: 1 / 1; }
.s2 { grid-column: span 2; aspect-ratio: 2 / 1; }
.f-tarjeta { width: 100%; }

@media (min-width: 900px) {
  .lienzo:not(.plano) {
    --tw: 440px;
    display: grid;
    grid-template-columns: var(--tw) 1fr;
    grid-template-rows: repeat(var(--filas, 4), minmax(0, 1fr));
    height: calc(var(--tw) * 1.77778);
    align-items: stretch;
    gap: var(--gap);
  }
  .pin-tarjeta { height: 100%; overflow: hidden; }
  .pin-tarjeta img { height: 100%; width: auto; max-width: 100%; margin: 0 auto; }
  .f-tarjeta { grid-column: 1; grid-row: 1 / -1; }
  .mini { grid-column: 2; grid-row: 1; min-height: 0; }
  .rejilla {
    grid-column: 2;
    grid-row: 2 / -1;
    grid-template-rows: repeat(var(--filasR, 1), minmax(0, 1fr));
    min-height: 0;
  }
  .lienzo.sin-mini .rejilla {
    grid-row: 1 / -1;
  }
  .s1, .s2 { aspect-ratio: auto; height: 100%; min-height: 0; overflow: hidden; }
}

/* El plano: geometria propia del mundo sin tarjeta.
   Vertical: 2 columnas. Ancho (telefono acostado, tablet,
   desktop): 4 columnas finas; anchas de dos en dos; la
   solitaria final se estira en franja esbelta. */
.lienzo.plano {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
  height: auto;
}
.plano .s1 { grid-column: span 1; aspect-ratio: 1 / 1; height: auto; }
.plano .s2 { grid-column: span 2; aspect-ratio: 2 / 1; height: auto; }
.plano .s4 { grid-column: span 2; aspect-ratio: 2 / 1; height: auto; }
@media (min-width: 640px) {
  .lienzo.plano { grid-template-columns: repeat(4, 1fr); }
  .plano .s4 { grid-column: span 4; aspect-ratio: 4 / 1; }
}

.pin-og {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pin-og img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  border-radius: 22px;
  box-shadow: 0 12px 32px rgba(0,0,0,.45);
  display: block;
  pointer-events: none;
}
/* Cabecera de combo: titulo + chip de autor (chip calcado del organismo) */
.pin-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 18px 4px 6px;
}
.pin-head .titulo {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(17px, 4.4vw, 25px);
  color: rgba(255,255,255,.95);
  line-height: 1.15;
}
.pin-head .chip {
  display: inline-block;
  font-family: 'Archivo', sans-serif;
  font-size: 13px;
  line-height: 1;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 12px;
  letter-spacing: 0.3px;
}

/* ---------- Pin tarjeta (la obra, proporción intacta sobre el cielo) ---------- */
.pin-tarjeta img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 22px;
  box-shadow: 0 10px 26px rgba(0,0,0,.45), 0 30px 70px rgba(0,0,0,.5);
  pointer-events: none;
}
.pin-tarjeta { cursor: pointer; }

/* ---------- Pin og: proporcion exacta, cero recortes ---------- */
.pin-og {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pin-og img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  border-radius: 22px;
  box-shadow: 0 12px 32px rgba(0,0,0,.45);
  display: block;
  pointer-events: none;
}
.pin-og.s1 { padding: 0; }
.pin-og.s1 img {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  object-fit: cover;
  object-position: left center;
  border-radius: 24px;
}

/* ---------- Pin bloque: piel calcada célula a célula ---------- */
.pin-bloque {
  container-type: size;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  border-radius: 24px;
  font-weight: 700;
  cursor: pointer;
  background-size: 320% 320%;
  background-position: center;
  transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity .6s cubic-bezier(0.19,1,0.22,1);
  overflow: hidden;
  isolation: isolate;
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.15),
    0 4px 6px rgba(0,0,0,.15),
    0 12px 32px rgba(0,0,0,.35);
}
.pin-bloque::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(145deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.08) 40%, transparent 100%);
  z-index: 1;
  pointer-events: none;
}
.pin-bloque::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12), transparent 60%);
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 0;
  pointer-events: none;
}
@media (hover: hover) {
  .pin-bloque:hover::after { opacity: 1; }
  .pin-bloque:hover {
    transform: translateY(-2px) scale(1.005);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(0,0,0,.16),
      inset 0 0 0 1px rgba(255,255,255,.16),
      0 3px 7px rgba(0,0,0,.14),
      0 18px 46px rgba(0,0,0,.42);
  }
}
.pin-bloque:active {
  transform: translateY(0) scale(0.995);
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}

.pin-bloque .cara {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  z-index: 2;
  text-align: center;
  transition: opacity 0.25s ease, transform 0.25s ease;
  -webkit-font-smoothing: antialiased;
}
.pin-bloque .cara.palabra {
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 700;
  font-size: clamp(15px, min(13cqw, 40cqh), 32px);
  letter-spacing: .005em;
  line-height: 1.12;
}
.pin-bloque .cara.frase {
  font-family: 'Archivo', sans-serif;
  font-weight: 500;
  font-size: clamp(12px, min(7cqw, 20cqh), 18px);
  line-height: 1.45;
  opacity: 0;
  transform: scale(.97);
  padding: 1rem 1.05rem 1.5rem;
  overflow-y: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 98%);
  mask-image: linear-gradient(180deg, #000 78%, transparent 98%);
}
.pin-bloque .cara.frase::-webkit-scrollbar { display: none; }
.pin-bloque .cara.frase .fx { margin: auto; }
.pin-bloque.volteada .cara.palabra { opacity: 0; transform: scale(.97); }
.pin-bloque.volteada .cara.frase { opacity: 1; transform: scale(1); }
.pin-bloque .puntos {
  position: absolute;
  bottom: 11px;
  left: 0;
  right: 0;
  display: flex;
  gap: 5px;
  justify-content: center;
  pointer-events: none;
  z-index: 2;
}
.pin-bloque .puntos i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: .3;
  transition: opacity .3s ease;
}
.pin-bloque .puntos i.on { opacity: .9; }

/* ---------- Pin nota: vidrio sobre la aurora ---------- */
.pin-nota {
  container-type: size;
  border-radius: 24px;
  padding: clamp(16px, 8cqh, 30px) clamp(18px, 6cqw, 34px);
  cursor: pointer;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 32px rgba(0,0,0,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}
.pin-nota .texto {
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 300;
  font-size: clamp(17px, 11.5cqh, 42px);
  line-height: 1.32;
  letter-spacing: -0.4px;
  color: #fff;
  max-width: 86%;
  position: relative;
  padding-bottom: 12px;
}
.pin-nota .texto::after {
  content: "";
  position: absolute;
  left: 22%;
  right: 22%;
  bottom: 0;
  height: 1px;
  opacity: .6;
  background: linear-gradient(90deg, transparent, var(--linea, #E35D30), transparent);
}

/* ---------- Menú de tres puntos ---------- */
.tres {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: rgba(8,8,12,.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: rgba(255,255,255,.92);
  font-size: 14px;
  line-height: 28px;
  cursor: pointer;
  z-index: 6;
  padding: 0;
  opacity: 0;
  transition: opacity .25s ease;
}
.pin:hover .tres, .menu.ver + .tres { opacity: 1; }
@media (hover: none) { .tres { opacity: .85; } }
.menu {
  position: fixed;
  z-index: 220;
  background: rgba(13,13,19,.98);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 14px;
  overflow: hidden;
  min-width: 164px;
  display: none;
  box-shadow: 0 18px 44px rgba(0,0,0,.6);
}
.menu.ver { display: block; }
.menu button, .menu a {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: rgba(255,255,255,.9);
  font-family: 'Poppins', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  padding: 11px 15px;
  cursor: pointer;
  text-decoration: none;
}
.menu button:active, .menu a:active { background: rgba(255,255,255,.08); }
.menu .peligro { color: #ff9d9d; }

#ptr {
  position: fixed;
  top: 58px;
  left: 50%;
  z-index: 56;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--chipb, rgba(8, 10, 14, .35));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -56px);
  opacity: 0;
  transition: transform .25s ease, opacity .25s ease;
  pointer-events: none;
}
#ptr .giro { font-size: 19px; line-height: 1; display: block; filter: grayscale(1) brightness(2.6); }
#ptr.girando .giro { animation: ptrGira .9s linear infinite; }
@keyframes ptrGira { to { transform: rotate(360deg); } }

/* ---------- El Santuario (ADN del bocado de la edicion) ---------- */
#santuario {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 32px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  opacity: 0;
  transition: opacity 0.4s ease;
  cursor: pointer;
}
#santuario.ver { display: flex; }
#santuario.on { opacity: 1; }
#santuario .cita {
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 300;
  font-size: clamp(22px, 6vw, 32px);
  line-height: 1.32;
  color: #fff;
  text-align: center;
  max-width: 640px;
  letter-spacing: -0.5px;
  position: relative;
  padding-bottom: 16px;
}
#santuario .cita::after {
  content: "";
  position: absolute;
  left: 20%;
  right: 20%;
  bottom: 0;
  height: 1px;
  opacity: .65;
  background: linear-gradient(90deg, transparent, var(--linea, #E35D30), transparent);
}

/* ---------- Tooltip de primera vez ---------- */
#tip {
  position: fixed;
  left: 50%;
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px);
  z-index: 60;
  background: rgba(13,13,19,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(227,93,48,.55);
  border-radius: 14px;
  padding: 10px 36px 10px 15px;
  font-family: 'Poppins', sans-serif;
  font-size: 12px;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  transition: opacity .5s ease, transform .5s ease;
  max-width: 84vw;
}
#tip.ver { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#tip .x {
  position: absolute;
  top: 4px;
  right: 6px;
  background: none;
  border: none;
  color: rgba(255,255,255,.6);
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
}

/* ---------- Vacío y carga ---------- */
.centro-msg {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 36px;
  z-index: 5;
}
.centro-msg.ver { display: flex; }
.esp-glifo { font-size: 46px; line-height: 1; margin-bottom: 20px; filter: grayscale(1) brightness(2.6); opacity: .92; }
.centro-msg .t1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(20px, 5.4vw, 27px);
  color: rgba(255,255,255,.92);
  margin: 0 0 10px;
}
.centro-msg .t2 {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(13px, 3.6vw, 15px);
  font-weight: 500;
  line-height: 1.55;
  color: rgba(255,255,255,.5);
  margin: 0;
  max-width: 340px;
}
.marca-aliento {
  height: 26px;
  width: auto;
  filter: invert(1) brightness(1.45);
  animation: breatheLoading 1.7s infinite ease-in-out;
}
@keyframes breatheLoading { 0%, 100% { opacity: 0.3; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } }

/* ---------- Puerta (clave) ---------- */
#puerta {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  z-index: 10;
}
#puerta.ver { display: flex; }
.puerta-card {
  width: 100%;
  max-width: 340px;
  background: rgba(12,12,18,.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 20px;
  padding: 30px 24px 24px;
  text-align: center;
}
.puerta-card img.marca { height: 21px; width: auto; opacity: .95; margin-bottom: 18px; filter: invert(1) brightness(1.45); }
.puerta-card h1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 24px;
  margin: 0 0 6px;
  color: #fff;
}
.puerta-card p.sub {
  font-family: 'Poppins', sans-serif;
  font-size: 12.5px;
  color: rgba(255,255,255,.55);
  margin: 0 0 18px;
  line-height: 1.5;
}
.puerta-card input {
  width: 100%;
  padding: 13px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.06);
  color: #fff;
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  text-align: center;

function _prng(n){
  var t = (SEMILLA + n) >>> 0;
  return function(){
    t += 0x6D2B79F5;
    var r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function _hashSlug(s){
  var h = 0;
  for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;

/* ---------- Datos ----------
   Piezas: un libro existe si tiene evento estrella o combo.
   El payload del combo trae palabras/frases/colores/textColors/
   bocado/eco copiados del origen. Los eventos quitar filtran
   componentes; quitar "todo" retira la pieza completa. */
function agrupar(filas){
  var mapa = {};
  var orden = [];
  for (var i = 0; i < filas.length; i++) {
    var f = filas[i];
    if (!f || !f.slug) continue;
    var llave = (f.catalogo || 'adulto') + ':' + f.slug;
    if (!mapa[llave]) {
      mapa[llave] = { slug: f.slug, catalogo: f.catalogo || 'adulto', titulo: '', portada: '',
                      ts: '', tsMadre: '', dorada: false, madre: false, payload: null, fueraTs: {} };
      orden.push(llave);
    }
    var n = mapa[llave];
    if (f.evento === 'estrella' || f.evento === 'combo') {
      n.madre = true;
      if (!n.ts) n.ts = f.ts;
      if (String(f.ts) > String(n.tsMadre)) n.tsMadre = f.ts;
      if (f.titulo) n.titulo = f.titulo;
      if (f.portada) n.portada = f.portada;
      if (f.evento === 'combo' && f.payload) {
        try { n.payload = JSON.parse(f.payload); } catch(e){}
      }
    }
    if (f.evento === 'releida') n.dorada = true;
    if (f.evento === 'quitar' && f.componente) {
      if (!n.fueraTs[f.componente] || String(f.ts) > String(n.fueraTs[f.componente])) n.fueraTs[f.componente] = f.ts;
    }
    if (!n.titulo && f.titulo) n.titulo = f.titulo;
    if (!n.portada && f.portada) n.portada = f.portada;
  }
  var piezas = [];
  for (var j = 0; j < orden.length; j++) {
    var nd = mapa[orden[j]];
    nd.fuera = {};
    for (var c in nd.fueraTs) {
      if (String(nd.fueraTs[c]) > String(nd.tsMadre)) nd.fuera[c] = true;
    }
    if (nd.madre && !nd.fuera['todo']) piezas.push(nd);
  }
  piezas.sort(function(a, b){ return String(b.ts).localeCompare(String(a.ts)); });
  return piezas;
}

function quitar(pz, componente, pinEl){

  estado.filas.push({ slug: pz.slug, catalogo: pz.catalogo, evento: 'quitar', componente: componente, ts: new Date().toISOString(), titulo:'', portada:'', payload:'' });
  lsSet(LS_CACHE, JSON.stringify({ nombre: estado.nombre, filas: estado.filas, ts: Date.now() }));
  if (componente === 'todo') { ultimaFirma = ''; pintar(); }
  else if (pinEl) {
    pinEl.style.transition = 'opacity .35s ease, transform .35s ease';
    pinEl.style.opacity = '0';
    pinEl.style.transform = 'scale(.94)';
    setTimeout(function(){ pinEl.remove(); }, 360);

}

// Barajado por combo: azar fresco en cada visita, con una regla de
// hospitalidad: la tarjeta jamas abre el combo (el tablero recibe primero).
function barajar(arr, slug){
  var rnd = _prng(_hashSlug(String(slug || '')));
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  if (arr.length > 1 && arr[0] && arr[0].esTarjeta) {
    for (var k = 1; k < arr.length; k++) {
      if (arr[k] && !arr[k].esTarjeta) { var s = arr[0]; arr[0] = arr[k]; arr[k] = s; break; }
    }
  }
  return arr;
}

/* ---------- Pintar el tablero ---------- */
var observador = null;
function vigilar(){
  if (observador) return observador;
  observador = new IntersectionObserver(function(entradas){
    for (var i = 0; i < entradas.length; i++) {
      if (entradas[i].isIntersecting) {
        entradas[i].target.classList.add('ver');
        observador.unobserve(entradas[i].target);
      }
    }
  }, { rootMargin: '0px 0px 140px 0px' });
  return observador;
}

function hexOscuro(hex, f){
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return '#000000';
  var n = parseInt(m[1], 16);
  function c(v){ v = Math.round(v * f); return (v < 16 ? '0' : '') + v.toString(16); }
  return '#' + c((n >> 16) & 255) + c((n >> 8) & 255) + c(n & 255);
}

function hexRgba(hex, a){
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return '';
  var n = parseInt(m[1], 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

// El cielo se tine con el libro EN PANTALLA: paleta completa del activo.
function paletaDe(pz){
  var pl = pz && pz.payload;
  if (!pl) return null;
  var cs = pl.colores || [];
  var arr = [pl.accent || cs[1], cs[2], cs[0]].filter(Boolean);
  return arr.length ? arr : null;
}

// ══ COLOR ROTATORIO DE LA CASA (calcado del organismo v9) ══
// Los colores nacen del CATALOGO (accents reales de los libros),
// con semilla del DIA (mismo dia = mismos colores; dia siguiente =
// sorpresa) y garantia de contraste: Δhue >= 50° en HSL.
// Pools en orden: /accents.json (catalogo real) → tu coleccion →
// fallback de la casa (azul espacial + teal).
var FALLBACK_CASA = ['#2864DC', '#50E6C8'];
var poolCatalogo = null;

function hexToHsl(hex){
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return { h: 0, s: 0, l: 0 };
  var n = parseInt(m[1], 16);
  var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  var h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h: h, s: s, l: l };
}

function diaHash(){
  var today = new Date().toDateString();
  var h = 5381;
  for (var i = 0; i < today.length; i++) h = ((h * 33) ^ today.charCodeAt(i)) >>> 0;
  return h;
}

// Devuelve [aurora1, aurora2, accentPrincipal] desde un pool de accents.
function auroraDelDia(accents){
  if (!accents || !accents.length) accents = FALLBACK_CASA;
  var h = diaHash();
  var principal = accents[h % accents.length];
  var mainHue = hexToHsl(principal).h;
  var cand = [];
  for (var i = 0; i < accents.length; i++) {
    var hu = hexToHsl(accents[i]).h;
    if (Math.abs(((hu - mainHue + 180) % 360) - 180) >= 50) cand.push(accents[i]);
  }
  var s1 = (h ^ 0x9e3779b9) >>> 0;
  var s2 = (h ^ 0x85ebca6b) >>> 0;
  var c1, c2;
  if (cand.length >= 2) {
    c1 = cand[s1 % cand.length];
    c2 = cand[s2 % cand.length];
    if (c2 === c1) c2 = cand[(s2 + 1) % cand.length];
  } else if (accents.length >= 2) {
    var i1 = s1 % accents.length, i2 = s2 % accents.length;
    if (i1 === i2) i2 = (i2 + 1) % accents.length;
    c1 = accents[i1]; c2 = accents[i2];
  } else {
    c1 = FALLBACK_CASA[0]; c2 = FALLBACK_CASA[1];
  }
  return [c1, c2, principal];
}

function poolColeccion(){
  var out = [];
  try {
    var piezas = agrupar(estado.filas || []);
    for (var i = 0; i < piezas.length; i++) {
      var pl = piezas[i].payload;
      var a = pl && (pl.accent || (pl.colores || [])[1]);
      if (a && out.indexOf(a) < 0) out.push(a);
    }
  } catch(e){}
  return out;
}

function paletaDelMomento(){
  var pool = (poolCatalogo && poolCatalogo.length) ? poolCatalogo : poolColeccion();
  return auroraDelDia(pool);
}

// El catalogo real llega en ~1KB y re-tine suave (transicion 1.4s).
(function cargarCatalogo(){
  try {
    var cc = JSON.parse(lsGet('triggui_accents_v1') || 'null');
    if (cc && cc.list && (Date.now() - cc.ts) < 21600000) { poolCatalogo = cc.list; return; }
  } catch(e){}
  fetch('/accents.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(list){
      if (Array.isArray(list) && list.length) {
        poolCatalogo = list;
        lsSet('triggui_accents_v1', JSON.stringify({ ts: Date.now(), list: list }));
        if (el.puerta.classList.contains('ver') || el.vacio.classList.contains('ver')) {
          paletaActual = '';
          tenirCon(paletaDelMomento());
        }
      }
    })
    .catch(function(){});
})();

var paletaActual = '';
function tenirCon(acentos){
  var llave = (acentos || []).join('|');
  if (llave === paletaActual) return;
  paletaActual = llave;
  var raiz = document.documentElement.style;
  var alfas = [0.42, 0.30, 0.22];
  for (var j = 0; j < 3; j++) {
    var c = (acentos && (acentos[j] || acentos[0])) || '';
    var v = c ? hexRgba(c, alfas[j]) : '';
    if (v) raiz.setProperty('--au' + (j + 1), v); else raiz.removeProperty('--au' + (j + 1));
  }
  var chip = acentos && acentos[0] ? hexRgba(acentos[0], 0.20) : '';
  if (chip) raiz.setProperty('--chipb', chip); else raiz.removeProperty('--chipb');
  var tema = document.getElementById('temaColor');
  if (tema) tema.setAttribute('content', acentos && acentos[0] ? hexOscuro(acentos[0], 0.16) : '#000000');
}

// Cabeceras vigiladas: la ultima que cruzo la franja de lectura manda.
var cabezas = [];
var ojo = null;
function tenirActiva(){
  var limite = window.innerHeight * 0.45;
  var activa = null;
  for (var i = 0; i < cabezas.length; i++) {
    var r = cabezas[i].getBoundingClientRect();
    if (r.top <= limite) activa = cabezas[i];
  }
  var pal = activa && paletaDe(activa.__pz);
  if (!pal) {
    for (var k = 0; k < cabezas.length && !pal; k++) pal = paletaDe(cabezas[k].__pz);
  }
  tenirCon(pal || paletaDelMomento());
}
function vigilarCabezas(){
  if (ojo) ojo.disconnect();
  ojo = new IntersectionObserver(function(){ tenirActiva(); },
    { root: el.tablero, rootMargin: '0px 0px -55% 0px', threshold: 0 });
  for (var i = 0; i < cabezas.length; i++) ojo.observe(cabezas[i]);
}

function pintar(){
  var firma = JSON.stringify([estado.nombre, estado.filas]);
  if (firma === ultimaFirma) return; // nada cambio: quietud absoluta
  ultimaFirma = firma;
  var piezas = agrupar(estado.filas);
  cabezas = [];
  el.inner.innerHTML = '';
  cerrarMenus();

  el.quien.textContent = estado.nombre ? ('Hola, ' + estado.nombre) : '';

  if (piezas.length === 0) { if (ojo) ojo.disconnect(); tenirCon(paletaDelMomento()); ver('vacio'); return; }
  ver('tablero');

  var ob = vigilar();
  var hayBloques = false;

  for (var p = 0; p < piezas.length; p++) {
    var pz = piezas[p];
    // Reparto exacto: palabras barajadas entre si, anchas entre si;
    // la tarjeta ancla el lienzo y todo lo demas reparte su altura.
    var bloques = [];
    var anchas = [];
    if (pz.payload) {
      if (!pz.fuera['bloque0']) bloques.push(pinBloque(pz, 0));
      if (!pz.fuera['bloque1']) bloques.push(pinBloque(pz, 1));
      if (!pz.fuera['bloque2']) bloques.push(pinBloque(pz, 2));
      if (!pz.fuera['bloque3']) bloques.push(pinBloque(pz, 3));
      if (!pz.fuera['bocado']) anchas.push(pinNota(pz, 'bocado'));
      if (!pz.fuera['eco']) anchas.push(pinNota(pz, 'eco'));
    }
    if (!pz.fuera['og']) anchas.push(pinOg(pz));
    bloques = bloques.filter(Boolean);
    anchas = anchas.filter(Boolean);
    barajar(bloques, 'b:' + pz.slug);
    barajar(anchas, 'a:' + pz.slug);
    for (var g = 0; g < anchas.length; g++) {
      if (anchas[g].classList.contains('pin-og')) { anchas.unshift(anchas.splice(g, 1)[0]); break; }
    }

    var lienzo = document.createElement('div');
    lienzo.className = 'lienzo';

    // El empacador: 2 ranuras por fila. Bloques ocupan 1; og y notas
    // ocupan 2 pero se ENCOGEN a 1 cuando un bloque queda solitario:
    // paridad perfecta, cero huecos, en cualquier escenario.
    function marcar(elx, ranuras){ elx.classList.add(ranuras === 1 ? 's1' : ranuras === 4 ? 's4' : 's2'); return elx; }

    function tomarPareja(){
      for (var t = 0; t < anchas.length; t++) {
        if (anchas[t].classList.contains('pin-nota')) return anchas.splice(t, 1)[0];
      }
      return anchas.shift();
    }

    var conTarjeta = !pz.fuera['tarjeta'];
    if (!conTarjeta) {
      // EL PLANO: bloques 4 por fila; huecos de la fila sellados
      // con anchas encogidas o a lo ancho; el resto de dos en dos;
      // la solitaria final, en franja esbelta.
      lienzo.classList.add('plano', 'sin-tarjeta');
      var fila1 = [];
      var restoB = bloques.slice();
      while (restoB.length && fila1.length < 4) fila1.push(marcar(restoB.shift(), 1));
      var libres = 4 - fila1.length;
      while (libres > 0 && anchas.length) {
        if (libres >= 2) { fila1.push(marcar(anchas.shift(), 2)); libres -= 2; }
        else { fila1.push(marcar(tomarPareja(), 1)); libres -= 1; }
      }
      for (var f1 = 0; f1 < fila1.length; f1++) lienzo.appendChild(fila1[f1]);
      while (anchas.length >= 2) {
        lienzo.appendChild(marcar(anchas.shift(), 2));
        lienzo.appendChild(marcar(anchas.shift(), 2));
      }
      if (anchas.length === 1) lienzo.appendChild(marcar(anchas.shift(), 4));
      var cab0 = pinHead(pz);
      cabezas.push(cab0);
      var pins = [cab0, lienzo];
      hayBloques = hayBloques || bloques.length > 0;
      for (var q0 = 0; q0 < pins.length; q0++) {
        el.inner.appendChild(pins[q0]);
        var anim0 = pins[q0].classList.contains('lienzo') ? pins[q0].querySelectorAll('.pin') : [pins[q0]];
        for (var w0 = 0; w0 < anim0.length; w0++) {
          if (primeraPintura) ob.observe(anim0[w0]);
          else anim0[w0].classList.add('ver');
        }
      }
      continue;
    }

    var mini = document.createElement('div');
    mini.className = 'mini';
    var restoBloques = bloques.slice();
    for (var m = 0; m < 2 && restoBloques.length; m++) mini.appendChild(marcar(restoBloques.shift(), 1));
    if (mini.children.length === 1 && anchas.length) mini.appendChild(marcar(tomarPareja(), 1));

    var rejilla = document.createElement('div');
    rejilla.className = 'rejilla';
    var filasR = 0;
    while (restoBloques.length >= 2) {
      rejilla.appendChild(marcar(restoBloques.shift(), 1));
      rejilla.appendChild(marcar(restoBloques.shift(), 1));
      filasR++;
    }
    if (restoBloques.length === 1) {
      rejilla.appendChild(marcar(restoBloques.shift(), 1));
      if (anchas.length) rejilla.appendChild(marcar(tomarPareja(), 1));
      filasR++;
    }
    var MAXR = 3;
    while (anchas.length && filasR < MAXR) { rejilla.appendChild(marcar(anchas.shift(), 2)); filasR++; }

    // Las que no caben con altura digna descienden a la banda inferior
    var banda = null;
    if (anchas.length) {
      banda = document.createElement('div');
      banda.className = 'lienzo plano banda';
      while (anchas.length >= 2) {
        banda.appendChild(marcar(anchas.shift(), 2));
        banda.appendChild(marcar(anchas.shift(), 2));
      }
      if (anchas.length === 1) banda.appendChild(marcar(anchas.shift(), 4));
    }

    var hayMini = mini.children.length > 0;
    if (hayMini) lienzo.appendChild(mini);
    if (conTarjeta) lienzo.appendChild(pinTarjeta(pz));
    if (rejilla.children.length) lienzo.appendChild(rejilla);
    if (!hayMini) lienzo.classList.add('sin-mini');

    lienzo.style.setProperty('--filas', (hayMini ? 1 : 0) + Math.max(filasR, hayMini ? 0 : 1));
    lienzo.style.setProperty('--filasR', Math.max(filasR, 1));

    var cab = pinHead(pz);
    cabezas.push(cab);
    var pins = [cab, lienzo];
    if (banda) pins.push(banda);

    hayBloques = hayBloques || bloques.length > 0;
    for (var q = 0; q < pins.length; q++) {
      if (!pins[q]) continue;
      el.inner.appendChild(pins[q]);
      var animables = pins[q].classList.contains('lienzo')
        ? pins[q].querySelectorAll('.pin')
        : [pins[q]];
      for (var w = 0; w < animables.length; w++) {
        if (primeraPintura) ob.observe(animables[w]);
        else animables[w].classList.add('ver');
      }
    }
  }

  vigilarCabezas();
  tenirActiva();
  primeraPintura = false;

  if (hayBloques && !lsGet(LS_TIP)) {
    el.tipTxt.textContent = 'Toca una palabra para voltear su frase';
    el.tip.classList.add('ver');
  }
}

function marcarTipVisto(){
  if (!lsGet(LS_TIP)) { lsSet(LS_TIP, '1'); el.tip.classList.remove('ver'); }
}
el.tipX.addEventListener('click', marcarTipVisto);

/* ---------- Arranque ---------- */
function fallo(mensaje){
  ver('puerta');
  el.puertaErr.textContent = mensaje || '';
}

function cargarConClave(clave, esNueva){
  estado.clave = clave;
  casarYVaciarEspiral(clave, function(){
  pedirEspiral(clave, function(err, r){
    if (err) {
      var cache = null;
      try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
      if (cache && cache.filas) {
        estado.nombre = cache.nombre || '';
        estado.filas = cache.filas;
        pintar();
        return;
      }
      fallo('Sin conexi\u00f3n. Intenta de nuevo.');
      return;
    }
    if (!r || r.ok !== true) {
      lsDel(LS_PAR);
      fallo(r && r.error === 'clave' ? 'Clave no reconocida.' : 'Algo fall\u00f3. Intenta de nuevo.');
      return;
    }
    if (esNueva) lsSet(LS_PAR, JSON.stringify({ c: clave }));
    estado.nombre = r.nombre || '';
    estado.filas = r.estrellas || [];
    lsSet(LS_CACHE, JSON.stringify({ nombre: estado.nombre, filas: estado.filas, ts: Date.now() }));
    pintar();
  });
  });
}

el.entrar.addEventListener('click', function(){
  var c = (el.clave.value || '').trim();
  if (c.length < 6) { el.puertaErr.textContent = 'Esa clave se ve corta.'; return; }
  el.puertaErr.textContent = '';
  ver('cargando');
  cargarConClave(c, true);
});
el.clave.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') el.entrar.click(); });

/* ---------- Refresh con swipe-down (solo tactil, a prueba de mundos) ---------- */
(function ptrInit(){
  var ind = document.getElementById('ptr');
  var y0 = 0, activo = false, d = 0, girando = false;
  function pinta(){
    var t = Math.min(d, 90);
    ind.style.opacity = t > 6 ? Math.min(t / 60, 1) : 0;
    ind.style.transform = 'translate(-50%, ' + (-56 + t) + 'px) rotate(' + (t * 3) + 'deg)';
  }
  function reposo(){
    ind.style.opacity = 0;
    ind.style.transform = 'translate(-50%, -56px)';
    ind.classList.remove('girando');
  }
  el.tablero.addEventListener('scroll', cerrarMenus, { passive: true });
el.tablero.addEventListener('touchstart', function(ev){
    if (girando) return;
    if (el.tablero.scrollTop <= 0 && ev.touches.length === 1) {
      y0 = ev.touches[0].clientY;
      activo = true;
      d = 0;
    }
  }, { passive: true });
  el.tablero.addEventListener('touchmove', function(ev){
    if (!activo || girando) return;
    var dy = ev.touches[0].clientY - y0;
    if (dy > 0 && el.tablero.scrollTop <= 0) {
      ev.preventDefault();
      d = dy * 0.5;
      pinta();
    } else {
      activo = false;
      reposo();
    }
  }, { passive: false });
  el.tablero.addEventListener('touchend', function(){
    if (!activo) return;
    activo = false;
    if (d > 58 && estado.clave) {
      girando = true;
      ind.classList.add('girando');
      ind.style.opacity = 1;
      ind.style.transform = 'translate(-50%, 12px)';
      ultimaFirma = '';
      cargarConClave(estado.clave, false);
      setTimeout(function(){ girando = false; reposo(); }, 1000);
    } else {
      reposo();
    }
  }, { passive: true });
})();

var OUTBOX_ESP = 'triggui_outbox_v1';
var PEND_ESP = 'triggui_pendiente_v1';
function vaciarOutboxEspiral(fin){
  var a = [];
  try { a = JSON.parse(window.localStorage.getItem(OUTBOX_ESP) || '[]'); } catch(e){ a = []; }
  if (!Array.isArray(a) || !a.length) { if (typeof fin === 'function') fin(); return; }
  var i = 0;
  (function paso(){
    if (i >= a.length) { if (typeof fin === 'function') fin(); return; }
    var e = a[i++];
    fetch(EXEC, { method: 'POST', body: new URLSearchParams(e.q) })
      .then(function(r){ return r.json(); })
      .then(function(r){
        if (r && r.ok) {
          try {
            var b = JSON.parse(window.localStorage.getItem(OUTBOX_ESP) || '[]');
            window.localStorage.setItem(OUTBOX_ESP, JSON.stringify(b.filter(function(x){ return x.id !== e.id; })));
          } catch(err){}
        }
        paso();
      })
      .catch(function(){ paso(); });
  })();
}
function casarYVaciarEspiral(clave, fin){
  try {
    var p = JSON.parse(window.localStorage.getItem(PEND_ESP) || '[]');
    if (Array.isArray(p) && p.length) {
      var b = [];
      try { b = JSON.parse(window.localStorage.getItem(OUTBOX_ESP) || '[]'); } catch(e){ b = []; }
      for (var i = 0; i < p.length; i++) {
        b.push({ id: p[i].id, q: p[i].q0 + '&clave=' + encodeURIComponent(clave), ts: Date.now() });
      }
      window.localStorage.setItem(OUTBOX_ESP, JSON.stringify(b.slice(-20)));
      window.localStorage.setItem(PEND_ESP, '[]');
    }
  } catch(e){}
  vaciarOutboxEspiral(fin);
}

(function inicio(){
  tenirCon(paletaDelMomento());
  vaciarOutboxEspiral();
  var c = claveGuardada();
  if (!c) { ver('puerta'); return; }
  var cache = null;
  try { cache = JSON.parse(lsGet(LS_CACHE) || 'null'); } catch(e){}
  if (cache && cache.filas && cache.filas.length) {
    estado.nombre = cache.nombre || '';
    estado.filas = cache.filas;
    pintar();
  } else {
    ver('cargando');
  }
  cargarConClave(c, false);
})();
</script>
