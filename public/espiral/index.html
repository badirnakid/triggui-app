<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<title>Triggui &middot; La Espiral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./spiral.triggui.css">
<style>
/* v15.4 · Puerta de miembro (calca de /mi/, en la voz visual de la helice) */
#puerta{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:28px;z-index:50;background:var(--bg,#0B0F1A)}
#puerta.ver{display:flex}
.puerta-card{width:100%;max-width:340px;background:rgba(12,12,18,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:30px 24px 24px;text-align:center;font-family:'Manrope',sans-serif}
.puerta-card .marca{width:96px;margin:0 auto 16px;display:block}
.puerta-card h1{font:800 22px/1.15 'Manrope',sans-serif;letter-spacing:-.01em;margin:0 0 6px;color:var(--ink,#F5F0E8)}
.puerta-card p.sub{font-size:12.5px;color:rgba(245,240,232,.55);margin:0 0 18px;line-height:1.5}
.puerta-card input{width:100%;padding:13px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;font:500 16px/1.2 'Manrope',sans-serif;text-align:center;letter-spacing:.14em;outline:none;box-sizing:border-box}
.puerta-card input:focus{border-color:var(--gold,#E8A838)}
.puerta-err{min-height:18px;font-size:12px;color:#ff9d9d;margin:9px 0 3px}
.puerta-card button{width:100%;padding:13px 0;border-radius:12px;border:1px solid var(--gold,#E8A838);background:rgba(232,168,56,.14);color:#fff;font:700 14px/1.2 'Manrope',sans-serif;cursor:pointer;transition:transform .2s ease,background .2s ease}
.puerta-card button:active{transform:scale(.98)}
.puerta-card button[disabled]{opacity:.6;cursor:default}
.puerta-pie{margin-top:16px;font-size:11px}
.puerta-pie a{color:rgba(245,240,232,.5);text-decoration:underline}
.puerta-cierra{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line,#232838);background:transparent;color:var(--dim,#b8b2a6);font:15px/1 'Manrope',sans-serif;cursor:pointer;z-index:51}
.puerta-cierra:active{transform:scale(.96)}
/* pie de la helice: ← REGRESAR a la izquierda, CERRAR SESION a la derecha; misma voz tipografica del HUD, zona del pulgar */
#hud-volver,#hud-salir{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));font:700 9px/1 'Manrope',sans-serif;letter-spacing:.16em;color:var(--faint,#77716a);text-decoration:none;opacity:.8;z-index:6;padding:10px 4px;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
#hud-volver{left:12px}
#hud-salir{right:12px}
#hud-volver:active,#hud-salir:active{opacity:1;color:var(--dim,#b8b2a6)}
</style>
<!-- GA4 base (AL) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CLK554FCNM"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-CLK554FCNM');</script>
</head>
<body>
<div id="app"></div>
<div id="puerta"><button class="puerta-cierra" id="puertaCierra" type="button" aria-label="Volver">&#10005;</button><div class="puerta-card">
  <img class="marca" src="./logo-triggui.png" alt="Triggui">
  <h1>La Espiral</h1>
  <p class="sub">El r&iacute;o semanal de ediciones vivas, con sus videos. Es para miembros.</p>
  <input id="clave" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tu clave de miembro">
  <div class="puerta-err" id="puertaErr"></div>
  <button id="entrar" type="button">Entrar</button>
  <div class="puerta-pie"><a href="https://triggui.com" target="_blank" rel="noopener">&iquest;A&uacute;n no eres miembro?</a></div>
</div></div>
<script>
/* ── PUERTA DE MIEMBRO (v15.4) · misma llave y mismo backend que /mi/ ── */
var EXEC='https://script.google.com/macros/s/AKfycbwWcUceg333PMcmSsLbEUAsx3os8AJ3Wdmjruv7zshHTqNmoxTastOsDU1h7V8qPk0nIQ/exec';
var LS_PAR='triggui_espiral_v1';
function lsGet(k){try{return window.localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{window.localStorage.removeItem(k);}catch(e){}}
function leerHash(){
  var h=String(window.location.hash||'');
  if(/[#&]salir(\b|=|$)/.test(h)){lsDel(LS_PAR);try{history.replaceState(null,'',window.location.pathname);}catch(e){}return 'salir';}
  var m=h.match(/[#&]k=([^&]+)/);
  if(m&&m[1]){lsSet(LS_PAR,JSON.stringify({c:decodeURIComponent(m[1]).trim()}));try{history.replaceState(null,'',window.location.pathname);}catch(e){}return 'clave';}
  return '';
}
leerHash();
/* en caliente: si ya estabas dentro y cambias el hash a #salir o #k=, se aplica y se recarga limpio */
window.addEventListener('hashchange',function(){ if(leerHash()) window.location.reload(); });
function claveMiembro(){try{var p=JSON.parse(lsGet(LS_PAR)||'null');return (p&&p.c)?String(p.c):'';}catch(e){return '';}}
var ORIGEN='';
try{
  var navEntrada=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||null;
  var esRecarga=navEntrada?(navEntrada.type==='reload'):!!(performance.navigation&&performance.navigation.type===1);
  var origenGuardado=window.sessionStorage.getItem('triggui_espiral_origen');
  var ref=String(document.referrer||'');
  var refEsYo=(ref.split('#')[0].split('?')[0]===window.location.origin+window.location.pathname);   /* recarga o auto-navegacion (SALIR, #k=) */
  if((esRecarga||refEsYo)&&origenGuardado!==null){ORIGEN=origenGuardado;}
  else{ORIGEN=ref;window.sessionStorage.setItem('triggui_espiral_origen',ORIGEN);}
}catch(e){ORIGEN=String(document.referrer||'');}
var CERRO=false;   /* la puerta aparecio porque el miembro cerro sesion: su ✕ va al centro, no "atras" */
try{if(window.sessionStorage.getItem('triggui_espiral_cerro')==='1'){CERRO=true;window.sessionStorage.removeItem('triggui_espiral_cerro');}}catch(e){}
function volverAlOrigen(){
  var deTriggui=ORIGEN.indexOf(window.location.origin+'/')===0&&ORIGEN.indexOf('/espiral')<0;
  if(!CERRO&&deTriggui&&window.history.length>1){window.history.back();}   /* regreso real: la pantalla anterior como estaba */
  else{window.location.replace('/');}
}
function validarClave(clave,cb){
  var cuerpo=new URLSearchParams();cuerpo.append('accion','espiral');cuerpo.append('clave',clave);
  fetch(EXEC,{method:'POST',body:cuerpo}).then(function(r){return r.json();}).then(function(r){cb(null,r);}).catch(function(e){cb(e,null);});
}
function puertaAbrir(arrancar){
  var box=document.getElementById('puerta'),inp=document.getElementById('clave'),err=document.getElementById('puertaErr'),btn=document.getElementById('entrar');
  box.classList.add('ver');
  try{gtag('event','espiral_puerta',{paso:'mostrada'});}catch(e){}
  function entrar(){
    var c=(inp.value||'').trim();
    if(c.length<6){err.textContent='Esa clave se ve corta.';return;}
    err.textContent='';btn.disabled=true;btn.textContent='Un momento\u2026';
    validarClave(c,function(e,r){
      btn.disabled=false;btn.textContent='Entrar';
      if(e){err.textContent='Sin conexi\u00f3n. Intenta de nuevo.';return;}
      if(!r||r.ok!==true){err.textContent=(r&&r.error==='clave')?'Clave no reconocida.':'Algo fall\u00f3. Intenta de nuevo.';try{gtag('event','espiral_puerta',{paso:'clave_mal'});}catch(x){}return;}
      lsSet(LS_PAR,JSON.stringify({c:c}));
      try{gtag('event','espiral_puerta',{paso:'entro'});}catch(x){}
      box.classList.remove('ver');
      arrancar();
    });
  }
  btn.onclick=entrar;
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')entrar();});
  document.getElementById('puertaCierra').onclick=function(){
    try{gtag('event','espiral_puerta',{paso:'volver'});}catch(e){}
    volverAlOrigen();
  };
  setTimeout(function(){try{inp.focus();}catch(e){}},50);
}
</script>
<script>
/* ── ADAPTADOR TRIGGUI → esquema del canon ── */
async function arrancarEspiral(){
  function lunesDe(iso){
    var d=new Date((iso||'').slice(0,10)); if(isNaN(d)) return null;
    d.setDate(d.getDate()-((d.getDay()+6)%7));
    return d.toISOString().slice(0,10);
  }
  function gesto(b){
    var bl=(b._nucleus&&b._nucleus.edition_blocks_es)||[];
    var tipos=['instruccion_sensorial','pregunta_directa'];
    for(var t=0;t<tipos.length;t++)for(var i=0;i<bl.length;i++)
      if(bl[i].gesture_type===tipos[t])return bl[i];
    return null;
  }
  function senal(b){
    var og=(b._nucleus&&b._nucleus.og_phrases_es)||[];
    for(var i=0;i<og.length;i++) if(og[i].rol_sinfonico==='aterrizar') return og[i].phrase;
    var fr=(b.frases||[]).filter(function(x){return x&&x.length>12});
    return fr[0]||'';
  }
  var libros=[];
  try{
    var d=await fetch('https://raw.githubusercontent.com/badirnakid/triggui-content/main/contenido_manual.json',{cache:'no-store'}).then(function(r){return r.json()});
    libros=(d.libros||[]).filter(function(b){return b&&b._edicion_numero&&b.titulo});
  }catch(e){}
  libros.sort(function(a,b){return a._edicion_numero-b._edicion_numero});
  var hechas={};
  try{hechas=JSON.parse(localStorage.getItem('triggui_espiral_hechas')||'{}');}catch(e){}
  var insights=libros.map(function(b){
    var sem=lunesDe(b._manual_generated_at||b._inputs_snapshot)||'2026-01-05';
    var g=gesto(b), id='ED-'+String(b._edicion_numero).padStart(3,'0');
    var ya=hechas[id];
    var vc=(function(v){if(!v||!v.candidatos||!v.candidatos.length)return null;var c=v.candidatos;return c[Math.floor(Math.random()*c.length)]||null;})(b._video);
    return {
      id:id, semana:sem,
      titulo:b.titulo+(b.autor?(' \u00b7 '+b.autor):''),
      slug:b._slug||'',
      c1:(b.colores&&b.colores[0])||'',
      c2:(b.colores&&b.colores[1])||'',
      voz:(b._nucleus&&b._nucleus.book_grounding_anchors&&b._nucleus.book_grounding_anchors.authorial_voice_notes)||'',
      video:(vc&&vc.id)||'',
      pie:(vc&&vc.pie)||'',
      videos:((b._video&&b._video.candidatos)||[]).map(function(c){return {id:String(c.id||''),pie:c.pie||'',rol:c.rol||'',idioma:c.idioma||'',titulo:c.titulo||''}}),
      portada:b.portada_url||b.portada||'',
      hallazgo:senal(b),
      movimiento:g?g.phrase:'',
      impacto:g&&g.sensory_anchor?String(g.sensory_anchor):'',
      estado: ya?'resuelto':'pendiente',
      resuelto_el: ya||undefined
    };
  });
  window.__PREVIEW_DATA__={
    cliente:{slug:'espiral',nombre:'TRIGGUI',url:'triggui.com',logo:'./logo-triggui.png',inicio:(insights[0]&&insights[0].semana)||'2026-01-05',plan:''},
    insights:insights
  };
  try{gtag('event','espiral_view',{ediciones:String(insights.length)});}catch(e){}
  var s=document.createElement('script'); s.src='./spiral.js'; document.body.appendChild(s);
  var volver=document.createElement('button'); volver.id='hud-volver'; volver.type='button'; volver.setAttribute('aria-label','Regresar'); volver.innerHTML='&#8592;&nbsp; REGRESAR';
  volver.onclick=function(){try{gtag('event','espiral_volver',{});}catch(e){}volverAlOrigen();};
  document.body.appendChild(volver);
  var salir=document.createElement('a'); salir.id='hud-salir'; salir.href='#salir'; salir.textContent='CERRAR SESI\u00d3N'; salir.setAttribute('aria-label','Cerrar sesi\u00f3n');
  salir.onclick=function(ev){ev.preventDefault();lsDel(LS_PAR);try{window.sessionStorage.setItem('triggui_espiral_cerro','1');}catch(e){}try{gtag('event','espiral_puerta',{paso:'salir'});}catch(e){}window.location.replace(window.location.pathname);};
  document.body.appendChild(salir);
}
if(claveMiembro()){arrancarEspiral();}else{puertaAbrir(arrancarEspiral);}
</script>
</body>
</html>
