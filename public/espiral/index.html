<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Triggui · La Espiral</title>
<meta name="description" content="Cuando el impulso te busque, aquí hay una señal esperándote.">
<meta name="theme-color" content="#0B0F1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<!-- GA4 base (AL) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CLK554FCNM"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-CLK554FCNM');</script>
<style>
:root{
  --void:#0B0F1A; --cream:#F5F0E8; --g1:#E8A838; --g2:#FF6B4A; --g3:#FF3F6C;
  --muted:rgba(245,240,232,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--void);color:var(--cream);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 60px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.34em;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:26px;font-weight:800;margin:8px 0 4px;text-align:center}
.sub{font-size:13.5px;color:var(--muted);text-align:center;max-width:340px;line-height:1.55;margin:0}
.pacto{font-size:11px;color:rgba(245,240,232,.4);margin-top:6px;letter-spacing:.04em;text-align:center}
#lienzo{width:min(92vw,560px);aspect-ratio:1;margin:6px 0 2px;touch-action:manipulation}
.bolita{cursor:pointer;transition:transform .25s ease}
.bolita:hover{transform:scale(1.18)}
.bolita.activa circle:first-child{stroke:url(#oro);stroke-width:3}
.num{font-size:10px;font-weight:800;pointer-events:none}
/* ── tarjeta viva ── */
#tarjeta{width:min(92vw,420px);border-radius:26px;padding:26px 24px 22px;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);transition:all .45s cubic-bezier(.2,.8,.2,1)}
#tarjeta.viva{opacity:1;transform:none}
#tEd{font-size:11px;font-weight:800;letter-spacing:.28em;opacity:.75}
#tTit{font-size:22px;font-weight:800;line-height:1.18;margin:10px 0 2px}
#tAut{font-size:13px;font-weight:600;opacity:.7;margin:0 0 16px}
#tFrase{font-size:16.5px;line-height:1.5;font-weight:600;margin:0 0 20px}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;text-align:center;border-radius:999px;padding:13px 16px;font-size:13px;font-weight:800;text-decoration:none;letter-spacing:.02em}
.btn.oro{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#0B0F1A}
.btn.linea{border:2px solid currentColor}
footer{margin-top:26px;font-size:11px;color:rgba(245,240,232,.35)}
footer a{color:inherit}
</style>
</head>
<body>
<div class="kicker">LA ESPIRAL</div>
<h1>Una señal te espera</h1>
<p class="sub">Si el impulso te trajo hasta aquí, respira. Toca una señal. Tú decides qué hacer con ella.</p>
<p class="pacto">Nueva señal cada lunes · a veces, una sorpresa · nunca te llamamos</p>

<svg id="lienzo" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8A838"/><stop offset=".55" stop-color="#FF6B4A"/><stop offset="1" stop-color="#FF3F6C"/>
    </linearGradient>
  </defs>
  <g id="giro"></g>
</svg>

<article id="tarjeta" aria-live="polite">
  <div id="tEd">EDICIÓN</div>
  <h2 id="tTit"></h2>
  <p id="tAut"></p>
  <p id="tFrase"></p>
  <div class="fila">
    <a id="btnVer" class="btn linea" href="#">Ver la edición</a>
    <a id="btnGuardar" class="btn oro" href="https://triggui.com/?utm_source=espiral&utm_medium=app&utm_campaign=guardar#espiral">Guardar en mi espiral 🌀</a>
  </div>
</article>

<footer><a href="/">‹ volver a triggui</a></footer>

<script>
(async function(){
  const FUENTE = 'https://raw.githubusercontent.com/badirnakid/triggui-content/main/contenido_manual.json';
  const PHI_ANG = 137.50776405003785; // ángulo áureo real
  let libros = [];
  try{
    const d = await fetch(FUENTE, {cache:'no-store'}).then(r=>r.json());
    libros = (d.libros || d || []).filter(b => b && b._edicion_numero && b.titulo);
  }catch(e){}
  if(!libros.length){ document.getElementById('tTit').textContent='La espiral descansa. Vuelve en un momento.'; document.getElementById('tarjeta').classList.add('viva'); return; }
  libros.sort((a,b)=> (b._edicion_numero||0) - (a._edicion_numero||0));

  const giro = document.getElementById('giro');
  const T = { ed:tEd, tit:tTit, aut:tAut, fr:tFrase, card:document.getElementById('tarjeta'), ver:btnVer };
  const C = 9.2; // factor de crecimiento del radio

  function pinta(i, b, activa){
    const r = C * Math.sqrt(i);                 // filotaxis: r ∝ √n
    const th = i * PHI_ANG * Math.PI/180;       // θ = n·137.508°
    const x = r*Math.cos(th), y = r*Math.sin(th);
    const size = Math.max(4.6, 9.5 - i*0.16);   // la nueva nace grande en el centro
    const col = (b.colores && b.colores[0]) || '#E8A838';
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','bolita'+(activa?' activa':''));
    g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)})`);
    g.innerHTML = `<circle r="${size}" fill="${col}" stroke="rgba(245,240,232,.25)" stroke-width="1"></circle>`+
      (size>=6.4?`<text class="num" text-anchor="middle" dy="3.4" fill="${(b.textColors&&b.textColors[0])||'#0B0F1A'}">${b._edicion_numero}</text>`:'');
    g.addEventListener('click',()=>abre(b,g));
    giro.appendChild(g);
    return g;
  }

  function abre(b, nodo){
    document.querySelectorAll('.bolita.activa').forEach(n=>n.classList.remove('activa'));
    if(nodo) nodo.classList.add('activa');
    const fondo = b.fondo || '#141a2b';
    const tinta = (b.textColors && b.textColors[1]) || (b.textColors && b.textColors[0]) || '#0B0F1A';
    const claro = esClaro(fondo);
    T.card.style.background = fondo;
    T.card.style.color = claro ? '#0B0F1A' : '#F5F0E8';
    T.ed.textContent = 'EDICIÓN #' + String(b._edicion_numero).padStart(3,'0');
    T.tit.textContent = b.titulo;
    T.aut.textContent = b.autor || '';
    const frases = (b.frases||[]).filter(f=>f && f.length>12);
    T.fr.textContent = frases.length ? frases[Math.floor(Math.random()*Math.min(3,frases.length))] : '';
    T.ver.href = '/t/' + (b._slug||'') + '/';
    T.card.classList.add('viva');
    try{ gtag('event','bolita_tap',{edicion:String(b._edicion_numero), libro:(b.titulo||'').slice(0,60)}); }catch(e){}
  }

  function esClaro(hex){
    const h = hex.replace('#',''); if(h.length<6) return false;
    const r=parseInt(h.slice(0,2),16), g2=parseInt(h.slice(2,4),16), bl=parseInt(h.slice(4,6),16);
    return (0.299*r + 0.587*g2 + 0.114*bl) > 150;
  }

  let primero = null;
  libros.forEach((b,i)=>{ const n = pinta(i, b, i===0); if(i===0) primero = [b,n]; });
  abre(primero[0], primero[1]);
  try{ gtag('event','espiral_view',{ediciones:String(libros.length)}); }catch(e){}
  document.getElementById('btnGuardar').addEventListener('click',()=>{ try{ gtag('event','guardar_click',{edicion:T.ed.textContent}); }catch(e){} });
})();
</script>
</body>
</html>
