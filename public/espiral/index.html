<style>
/* v15.11 · Puerta de miembro: el lenguaje de la barra magica (auroras con los colores de la ultima edicion,
   vidrio, acento dinamico), el 🌀 que acaban de tocar, y el texto de para que sirve tu espiral */
#puerta{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:28px;z-index:50;background:var(--bg,#0B0F1A);overflow:hidden;
  --pa:#E8A838;--pa-40:rgba(232,168,56,.4);--pa-18:rgba(232,168,56,.18);--pa-10:rgba(232,168,56,.1);--p1:rgba(40,100,220,.48);--p2:rgba(80,230,200,.42);--pc1:#7b61ff;--pc2:#30ffe4;--ptxt:#fff}
#puerta.ver{display:flex}
.puerta-aurora{position:absolute;width:320px;height:320px;border-radius:50%;filter:blur(60px);will-change:transform;pointer-events:none;opacity:.9}
.puerta-aurora.a1{top:-100px;left:-80px;background:var(--p1);animation:puerta-drift-1 22s ease-in-out infinite}
.puerta-aurora.a2{bottom:-80px;right:-60px;background:var(--p2);animation:puerta-drift-2 26s ease-in-out infinite}
@keyframes puerta-drift-1{0%,100%{transform:translate(0,0)}33%{transform:translate(40px,80px)}66%{transform:translate(-30px,50px)}}
@keyframes puerta-drift-2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-80px)}}
.puerta-card{position:relative;width:100%;max-width:340px;text-align:center;font-family:'Manrope',sans-serif}
.puerta-card .glifo{font-size:52px;line-height:1;display:block;margin:0 auto 14px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.puerta-card .glifo span{display:inline-block;animation:puerta-giro 14s linear infinite}
@keyframes puerta-giro{to{transform:rotate(360deg)}}
.puerta-card h1{font:800 26px/1.1 'Manrope',sans-serif;letter-spacing:-.02em;margin:0 0 12px;color:#fff}
.puerta-card p.sub{font:400 15px/1.6 'Manrope',sans-serif;color:rgba(255,255,255,.72);margin:0 0 24px}
.puerta-card p.sub b{color:var(--pa);font-weight:600}
.puerta-card input{width:100%;padding:17px 20px;border-radius:20px;border:.5px solid rgba(255,255,255,.13);background:rgba(255,255,255,.035);color:#fff;font:400 16px/1.4 'Manrope',sans-serif;text-align:center;letter-spacing:.1em;outline:none;box-sizing:border-box;transition:all .4s cubic-bezier(.19,1,.22,1)}
.puerta-card input::placeholder{color:rgba(255,255,255,.3);font-style:italic;letter-spacing:0}
.puerta-card input:focus{background:rgba(255,255,255,.055);border-color:var(--pa-40);box-shadow:inset 0 .5px 0 rgba(255,255,255,.1),0 0 0 4px var(--pa-10),0 20px 50px var(--pa-18)}
.puerta-err{min-height:18px;font-size:12.5px;color:#ff9d9d;margin:10px 0 4px}
.puerta-card button{width:100%;padding:16px 0;border-radius:16px;border:0;background:linear-gradient(135deg,var(--pc1),var(--pc2));color:var(--ptxt);font:700 16px/1.2 'Manrope',sans-serif;cursor:pointer;transition:transform .15s cubic-bezier(.4,0,.2,1);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.35)}
.puerta-card button:active{transform:scale(.98)}
.puerta-card button[disabled]{opacity:.6;cursor:default}
.puerta-pie{margin-top:18px;font-size:12px}
.puerta-pie a{color:rgba(255,255,255,.5);text-decoration:underline}
.puerta-marca{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);width:82px;opacity:.85;pointer-events:none;transition:opacity .3s ease}
#puerta:focus-within .puerta-marca{opacity:0}
.puerta-cierra{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line,#232838);background:transparent;color:var(--dim,#b8b2a6);font:15px/1 'Manrope',sans-serif;cursor:pointer;z-index:51}
.puerta-cierra:active{transform:scale(.96)}
/* pie de la helice: ← REGRESAR a la izquierda, CERRAR SESION a la derecha; misma voz tipografica del HUD, zona del pulgar */
#hud-volver,#hud-salir{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));font:700 9px/1 'Manrope',sans-serif;letter-spacing:.16em;color:var(--faint,#77716a);text-decoration:none;opacity:.8;z-index:6;padding:10px 4px;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
#hud-volver{left:12px}
#hud-salir{right:12px}
#hud-volver:active,#hud-salir:active{opacity:1;color:var(--dim,#b8b2a6)}
body.hoja-abierta #hud-volver,body.hoja-abierta #hud-salir{display:none}   /* solo en la primera pantalla, nunca sobre la Tarjeta */

<script>
/* ── PUERTA DE MIEMBRO (v15.4) · misma llave y mismo backend que /mi/ ── */
var EXEC='https://script.google.com/macros/s/AKfycbwWcUceg333PMcmSsLbEUAsx3os8AJ3Wdmjruv7zshHTqNmoxTastOsDU1h7V8qPk0nIQ/exec';
var LS_PAR='triggui_espiral_v1';
function lsGet(k){try{return window.localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{window.localStorage.removeItem(k);}catch(e){}}
function leerHash(){
  var h=String(window.location.hash||'');
  if(/[#&]salir(\b|=|$)/.test(h)){lsDel(LS_PAR);try{history.replaceState(null,'',window.location.pathname);}catch(e){}return 'salir';}
  var m=h.match(/[#&]k=([^&]+)/);
  if(m&&m[1]){lsSet(LS_PAR,JSON.stringify({c:decodeURIComponent(m[1]).trim().replace(/[^A-Za-z0-9_-]/g,'')}));try{history.replaceState(null,'',window.location.pathname);}catch(e){}return 'clave';}
  return '';
}
leerHash();
/* en caliente: si ya estabas dentro y cambias el hash a #salir o #k=, se aplica y se recarga limpio */
window.addEventListener('hashchange',function(){ if(leerHash()) window.location.reload(); });
function claveMiembro(){try{var p=JSON.parse(lsGet(LS_PAR)||'null');return (p&&p.c)?String(p.c):'';}catch(e){return '';}}
/* 📦 caja negra: estado de la helice (puerta o dentro) */
window.__cajaEstado=function(){ try{ var e=window.__espiralEstado?window.__espiralEstado():{}; var pu=document.getElementById('puerta'); e.puerta=!!(pu&&pu.classList.contains('ver')); e.sesion=!!claveMiembro(); e.origen=ORIGEN||'-'; e.cerro=!!CERRO; return e; }catch(er){ return {err:String(er&&er.message||er)}; } };
var ORIGEN='';
try{
  var navEntrada=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||null;
  var esRecarga=navEntrada?(navEntrada.type==='reload'):!!(performance.navigation&&performance.navigation.type===1);
  var origenGuardado=window.sessionStorage.getItem('triggui_espiral_origen');
  var ref=String(document.referrer||'');
  var refPath=ref.split('#')[0].split('?')[0];
  /* 🌀 v6.1: helice y guardados son el MISMO territorio interior. Viajar entre ellos (o recargar,
     o auto-navegar con SALIR/#k=) NO pisa la memoria del origen: el origen es la pantalla de
     bloques (home o edicion) de la que vino el viaje, y REGRESAR siempre vuelve ahi. */
  var refEsPortal=(refPath===window.location.origin+window.location.pathname)||/^https?:\/\/[^\/]+\/(espiral|mi)\/?$/.test(refPath);
  if((esRecarga||refEsPortal)&&origenGuardado!==null){ORIGEN=origenGuardado;}
  else{ORIGEN=ref;window.sessionStorage.setItem('triggui_espiral_origen',ORIGEN);try{window.sessionStorage.setItem('triggui_espiral_origen_t',String(Date.now()));}catch(x){}}
}catch(e){ORIGEN=String(document.referrer||'');}
var CERRO=false;   /* la puerta aparecio porque el miembro cerro sesion: su ✕ va al centro, no "atras" */
try{if(window.sessionStorage.getItem('triggui_espiral_cerro')==='1'){CERRO=true;window.sessionStorage.removeItem('triggui_espiral_cerro');}}catch(e){}
function volverAlOrigen(){
  // 🌀 v6: REGRESAR devuelve al ORIGEN REAL (los 4 bloques del home O la edición de la que vino).
  // Si el origen es la entrada anterior del historial, back() restaura la pantalla TAL CUAL
  // (sin recargar ni regenerar); si no, navegación directa al origen; si no hay origen, la raíz.
  try{gtag('event','espiral_volver_bloques',{});}catch(e){}
  var RAIZ='https://app.triggui.com/';
  var destino='';
  try{
    var o=String(ORIGEN||'');
    var yo=window.location.origin+window.location.pathname;
    if(o && o.indexOf(window.location.origin)===0 && o.split('#')[0].split('?')[0]!==yo) destino=o;
  }catch(e){}
  try{
    var ref=String(document.referrer||'');
    if(destino && ref && ref.split('#')[0]===destino.split('#')[0] && window.history.length>1){
      var red=setTimeout(function(){ try{ window.location.href=destino; }catch(e){} }, 900);
      window.addEventListener('pagehide', function(){ try{ clearTimeout(red); }catch(e){} }, {once:true});
      window.history.back();
      return;
    }
  }catch(e){}
  window.location.href = destino || RAIZ;
}
function validarClave(clave,cb){
  var cuerpo=new URLSearchParams();cuerpo.append('accion','espiral');cuerpo.append('clave',clave);
  fetch(EXEC,{method:'POST',body:cuerpo}).then(function(r){return r.json();}).then(function(r){cb(null,r);}).catch(function(e){cb(e,null);});
}
function hexRgba(h,a){try{var c=String(h||'').replace('#','').trim();if(c.length===3)c=c.split('').map(function(x){return x+x;}).join('');var r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);if([r,g,b].some(isNaN))return '';return 'rgba('+r+','+g+','+b+','+a+')';}catch(e){return '';}}
function lum(h){try{var c=String(h||'').replace('#','');if(c.length===3)c=c.split('').map(function(x){return x+x;}).join('');var r=parseInt(c.slice(0,2),16)/255,g=parseInt(c.slice(2,4),16)/255,b=parseInt(c.slice(4,6),16)/255;var f=function(v){return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};return .2126*f(r)+.7152*f(g)+.0722*f(b);}catch(e){return 0;}}
function clarito(h){ /* acento legible sobre fondo oscuro: luminosidad HSL entre 58% y 72%, como la barra magica */
  try{var c=String(h||'').replace('#','');if(c.length===3)c=c.split('').map(function(x){return x+x;}).join('');var r=parseInt(c.slice(0,2),16)/255,g=parseInt(c.slice(2,4),16)/255,b=parseInt(c.slice(4,6),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,sat=d?d/(1-Math.abs(2*l-1)):0,hh=0;
  if(d){hh=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;hh=Math.round(hh*60);if(hh<0)hh+=360;}
  return 'hsl('+hh+','+Math.round(sat*100)+'%,'+Math.min(72,Math.max(58,Math.round(l*100+18)))+'%)';}catch(e){return '#E8A838';}
}
function puertaColorear(libros){ /* la puerta toma los colores de la ultima edicion, como la barra magica toma los del libro */
  try{
    var ult=libros&&libros.length?libros[libros.length-1]:null; var col=(ult&&ult.colores)||[];
    var c1=/^#[0-9a-fA-F]{6}$/.test(col[0]||'')?col[0]:'', c2=/^#[0-9a-fA-F]{6}$/.test(col[1]||'')?col[1]:'';
    if(!c1||!c2) return;
    var st=document.getElementById('puerta').style;
    st.setProperty('--pc1',c1);st.setProperty('--pc2',c2);st.setProperty('--ptxt',(lum(c1)+lum(c2))/2>.35?'#000':'#fff');
    st.setProperty('--p1',hexRgba(c1,.48));st.setProperty('--p2',hexRgba(c2,.42));
    var pa=clarito(c1);st.setProperty('--pa',pa);
    var pa40=hexRgba(c1,.40),pa18=hexRgba(c1,.18),pa10=hexRgba(c1,.10);if(pa40){st.setProperty('--pa-40',pa40);st.setProperty('--pa-18',pa18);st.setProperty('--pa-10',pa10);}
  }catch(e){}
}
function puertaAbrir(arrancar){
  var box=document.getElementById('puerta'),inp=document.getElementById('clave'),err=document.getElementById('puertaErr'),btn=document.getElementById('entrar');
  box.classList.add('ver');
  try{gtag('event','espiral_puerta',{paso:'mostrada'});}catch(e){}
  function entrar(){
    var c=(inp.value||'').trim();
    if(c.length<6){err.textContent=pvT('Esa clave se ve corta.','That key looks too short.');return;}
    err.textContent='';btn.disabled=true;btn.textContent='Un momento\u2026';
    validarClave(c,function(e,r){
      btn.disabled=false;btn.textContent='Entrar';
      if(e){err.textContent='Sin conexi\u00f3n. Intenta de nuevo.';return;}
      if(!r||r.ok!==true){err.textContent=(r&&r.error==='clave')?'Clave no reconocida.':'Algo fall\u00f3. Intenta de nuevo.';try{gtag('event','espiral_puerta',{paso:'clave_mal'});}catch(x){}return;}
      lsSet(LS_PAR,JSON.stringify({c:c})); try{ window.__EXEC=EXEC; window.__CLAVE=c; __syncMerge([].concat(r.senales||[], r.estrellas||[])); }catch(x){}
      try{gtag('event','espiral_puerta',{paso:'entro'});}catch(x){}
      box.classList.remove('ver');
      arrancar();
    });
  }
  btn.onclick=entrar;
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')entrar();});
  document.getElementById('puertaCierra').onclick=function(){
    try{gtag('event','espiral_puerta',{paso:'volver'});}catch(e){}
    volverAlOrigen();
  };
}
</script>
<script>
/* PV — idioma del portal: misma llave que la app (triggui_lang), fallback navigator */

/* sync de senales (modelo combos): filas evento hecha/deshecha en ESTRELLAS; el servidor manda */
function __syncMerge(estrellas){ try{
  var ev={};
  (estrellas||[]).forEach(function(f){ if(!f) return;
    var s=String(f.slug||''), e=String(f.evento||''), ts=String(f.ts||'');
    var id=null, on=null;
    if(e==='hecha'){ id=s.toUpperCase(); on=true; }
    else if(e==='deshecha'){ id=s.toUpperCase(); on=false; }
    else if(s.indexOf('sync-hecha-')===0){ id=s.replace('sync-hecha-','').toUpperCase(); on=true; }
    else if(s.indexOf('sync-deshecha-')===0){ id=s.replace('sync-deshecha-','').toUpperCase(); on=false; }
    if(id===null) return;
    if(!ev[id]||ts>ev[id].ts) ev[id]={on:on,ts:ts};
  });
  var m={};
  Object.keys(ev).forEach(function(id){ if(ev[id].on) m[id]=(ev[id].ts||'').slice(0,10)||'1'; });
  var st=window.__sesionToggles||{};
  Object.keys(st).forEach(function(id){ if(st[id]){ if(!m[id]) m[id]=new Date().toISOString().slice(0,10); } else { delete m[id]; } });
  localStorage.setItem('triggui_espiral_hechas', JSON.stringify(m));
}catch(e){} }
window.__syncHecha=function(id,on){ try{ (window.__sesionToggles=window.__sesionToggles||{})[String(id).toUpperCase()]=!!on;
  var q=new URLSearchParams(); q.append('accion','marcar'); q.append('clave', window.__CLAVE||'');
  q.append('slug', String(id).toLowerCase()); q.append('evento', on?'hecha':'deshecha'); q.append('titulo','');
  fetch(window.__EXEC, {method:'POST', body:q}).catch(function(){});
}catch(e){} };
function __bootSync(clave, listo){
  try{ window.__EXEC=EXEC; window.__CLAVE=clave; }catch(e){}
  try{ listo(); }catch(e){}
  try{
    var q=new URLSearchParams(); q.append('accion','espiral'); q.append('clave',clave);
    fetch(EXEC,{method:'POST',body:q}).then(function(r){return r.json();}).then(function(r){
      if(r&&r.ok===true){
        __syncMerge([].concat(r.senales||[], r.estrellas||[]));
        try{ if(window.__syncRefresh) window.__syncRefresh(); }catch(e){}
      }
    }).catch(function(){});
  }catch(e){} }
window.PV_LANG=(function(){try{var s=JSON.parse(localStorage.getItem('triggui_lang')||'null');if(s==='en'||s==='es')return s;}catch(e){}return ((navigator.language||'es').slice(0,2)==='en')?'en':'es';})();
window.pvT=window.pvT||function(es,en){return (window.PV_LANG==='en')?en:es;};
try{
  /* Nombre visible bajo cada puente: nadie tiene que adivinar a dónde lleva la carita. */
  var __pg2=document.getElementById('puenteGuardados');
  if(__pg2) __pg2.setAttribute('data-nombre', window.pvT('Guardados','Saved'));
  var __pb2=document.getElementById('puenteBarra');
  if(__pb2) __pb2.setAttribute('data-nombre', window.pvT('Barra','Bar'));
}catch(e){}
if(window.PV_LANG==='en'){try{var _pg=document.getElementById('puenteGuardados'); if(_pg)_pg.setAttribute('aria-label','Go to saved'); var _pb=document.getElementById('puenteBarra'); if(_pb)_pb.setAttribute('aria-label','Open the magic bar');}catch(e){}}
window.pvTitulo=function(b){return (PV_LANG==='en'&&b&&b.titulo_en)?b.titulo_en:((b&&b.titulo)||'');};
window.pvBloques=function(b){var n=(b&&b._nucleus)||{};return (PV_LANG==='en'&&n.edition_blocks_en&&n.edition_blocks_en.length)?n.edition_blocks_en:(n.edition_blocks_es||[]);};
window.pvOg=function(b){var n=(b&&b._nucleus)||{};return (PV_LANG==='en'&&n.og_phrases_en&&n.og_phrases_en.length)?n.og_phrases_en:(n.og_phrases_es||[]);};
window.pvT=function(es,en){return PV_LANG==='en'?en:es;};

      videos:((b._video&&b._video.candidatos)||[]).map(function(c){return {id:String(c.id||''),pie:c.pie||'',pie_en:c.pie_en||'',rol:c.rol||'',idioma:c.idioma||'',titulo:c.titulo||''}}),
      portada:b.portada_url||b.portada||'',
      hallazgo:senal(b),
      movimiento:g?g.phrase:'',
      impacto:g&&g.sensory_anchor?String(g.sensory_anchor):'',
      estado: ya?'resuelto':'pendiente',
      resuelto_el: ya||undefined
    };
  });
  window.__PREVIEW_DATA__={
    cliente:{slug:'espiral',nombre:'TRIGGUI',url:'triggui.com',logo:'./logo-triggui.png',inicio:(insights[0]&&insights[0].semana)||'2026-01-05',plan:''},
    insights:insights

  try{gtag('event','espiral_view',{ediciones:String(insights.length)});}catch(e){}
  var s=document.createElement('script'); s.src='./spiral.js?v=i18n2';
  s.onload=function(){ try{ var hoja=document.getElementById('hoja'); if(hoja){ var mo=new MutationObserver(function(){ document.body.classList.toggle('hoja-abierta', hoja.classList.contains('ver')); }); mo.observe(hoja,{attributes:true,attributeFilter:['class']}); } }catch(e){} };
  document.body.appendChild(s);
  var volver=document.createElement('button'); volver.id='hud-volver'; volver.type='button'; volver.setAttribute('aria-label',(window.PV_LANG==='en')?'Back':'Regresar'); volver.innerHTML='&#8592;&nbsp; '+((window.PV_LANG==='en')?'BACK':'REGRESAR');
  volver.onclick=function(){try{gtag('event','espiral_volver',{});}catch(e){}volverAlOrigen();};
  document.body.appendChild(volver);
  var salir=document.createElement('a'); salir.id='hud-salir'; salir.href='#salir'; salir.textContent=(window.PV_LANG==='en')?'LOG OUT':'CERRAR SESI\u00d3N'; salir.setAttribute('aria-label',(window.PV_LANG==='en')?'Log out':'Cerrar sesi\u00f3n');
  salir.onclick=function(ev){ev.preventDefault();lsDel(LS_PAR);try{window.sessionStorage.setItem('triggui_espiral_cerro','1');}catch(e){}try{gtag('event','espiral_puerta',{paso:'salir'});}catch(e){}window.location.replace(window.location.pathname);};

if(claveMiembro()){__bootSync(claveMiembro(), arrancarEspiral);}else{puertaAbrir(arrancarEspiral);cargarLibros().then(puertaColorear);}

/* Pill de idioma: se coloca MIDIENDO en vivo lo que ya vive arriba (la barra de
   progreso con su carita en la hélice, el saludo en guardados) y queda debajo,
   nunca encima. Si no cabe, no nace. */
#tgLangPill{position:fixed;top:var(--tg-pill-top,72px);right:14px;z-index:60;display:flex;
  background:rgba(12,14,22,.72);border:.5px solid rgba(255,255,255,.14);border-radius:99px;padding:3px;

#tgLangPill span.lang-active{color:#0B0F1A;background:#F5F0E8}
#tgLangPill:active{transform:scale(.96)}

<script id="tg-pill-js">
(function () {
  var LS = "triggui_lang";
  function actual() {
    if (window.PV_LANG === "en" || window.PV_LANG === "es") return window.PV_LANG;
    try { var v = JSON.parse(localStorage.getItem(LS) || "null"); if (v === "en" || v === "es") return v; } catch (e) {}
    return ((navigator.language || "es").slice(0, 2) === "en") ? "en" : "es";
  }
  function visible(e) {
    if (!e) return false;
    var cs = getComputedStyle(e);
    if (cs.display === "none" || cs.visibility === "hidden" || cs.opacity === "0") return false;
    var r = e.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function coloca() {
    try {
      var __p = document.getElementById("tgLangPill");
      /* Con la puerta abierta la pill no existe: ese momento es de la clave, y
         además chocaría con la ✕ de cerrar, que vive en la misma esquina. */
      if (__p) __p.style.display = visible(document.getElementById("puerta")) ? "none" : "flex";
      var tope = 16;
      /* lo que ya ocupa la esquina superior derecha en esta pantalla */
      var vecinos = ["hud-datos", "barra", "quien"];
      for (var i = 0; i < vecinos.length; i++) {
        var e = document.getElementById(vecinos[i]);
        if (!e) continue;
        var cs = getComputedStyle(e);
        if (cs.display === "none" || cs.visibility === "hidden") continue;
        var r = e.getBoundingClientRect();
        if (r.height > 0 && r.top < 220) tope = Math.max(tope, Math.round(r.bottom));
      }
      document.documentElement.style.setProperty("--tg-pill-top", (tope + 14) + "px");
    } catch (e) {}
  }
  function pinta() {
    var p = document.getElementById("tgLangPill"); if (!p) return;
    var en = (actual() === "en");
    p.querySelector("#tgLangEs").className = en ? "" : "lang-active";
    p.querySelector("#tgLangEn").className = en ? "lang-active" : "";
  }
  function nace() {
    if (document.getElementById("tgLangPill")) return;
    var b = document.createElement("button");
    b.id = "tgLangPill"; b.type = "button"; b.setAttribute("aria-label", "Toggle language");
    b.innerHTML = '<span id="tgLangEs">Español</span><span id="tgLangEn">English</span>';
    b.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      var nuevo = (actual() === "en") ? "es" : "en";
      try { localStorage.setItem(LS, JSON.stringify(nuevo)); } catch (x) {}
      try { gtag("event", "portal_idioma", { idioma: nuevo }); } catch (x) {}
      /* El portal traduce al arrancar (su maquinaria es de una sola dirección),
         así que se recarga — pero con un velo suave para que se sienta un cambio
         de idioma y no un parpadeo. */
      try {
        window.PV_LANG = nuevo;
        pinta();
        var velo = document.createElement("div");
        velo.style.cssText = "position:fixed;inset:0;z-index:9998;background:#0B0F1A;opacity:0;" +
          "transition:opacity .26s ease;pointer-events:none";
        document.body.appendChild(velo);
        requestAnimationFrame(function () { velo.style.opacity = "1"; });
        setTimeout(function () { location.reload(); }, 260);
      } catch (x) { location.reload(); }
    });
    document.body.appendChild(b);
    pinta(); coloca();
  }
  function arranca() {
    nace();
    setTimeout(coloca, 400); setTimeout(coloca, 1200); setTimeout(coloca, 2600);
    window.addEventListener("resize", coloca);
    try { new MutationObserver(coloca).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arranca);
  else arranca();
})();
</script>
