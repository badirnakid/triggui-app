<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Serif+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F5F0E8;background:linear-gradient(135deg,{{ACCENT}} 0%,{{ACCENT2}} 100%);position:relative}
.velo{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 30%,rgba(255,255,255,.12),transparent 55%),linear-gradient(180deg,rgba(11,15,26,.10),rgba(11,15,26,.62))}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:56px;padding:56px 72px 56px 64px}
.art{width:420px;height:420px;border-radius:32px;object-fit:cover;flex:none;box-shadow:0 34px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.18)}
.art-fallback{width:420px;height:420px;border-radius:32px;flex:none;display:flex;align-items:center;justify-content:center;font-size:160px;background:rgba(0,0,0,.28);box-shadow:0 34px 90px rgba(0,0,0,.5)}
.txt{flex:1;min-width:0}
.kicker{font-size:22px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.9;margin-bottom:18px}
.cancion.larga{font-size:46px;-webkit-line-clamp:4}
.cancion{font-family:'Noto Serif Display',Georgia,serif;font-weight:600;font-size:64px;line-height:1.05;margin:0 0 14px;text-shadow:0 4px 24px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.artista{font-size:30px;font-weight:700;opacity:.92;margin-bottom:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie{font-family:'Noto Serif Display',Georgia,serif;font-style:italic;font-size:26px;line-height:1.3;opacity:.95;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{position:absolute;left:64px;right:72px;bottom:34px;display:flex;align-items:center;justify-content:space-between}
.foot img{height:34px}
.foot span{font-size:22px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:760px}
</style>
</head>
<body>
<div class="velo"></div>
<div class="wrap">
  {{ART_TAG}}
  <div class="txt">
    <div class="kicker">🎧 30 segundos para leer</div>
    <div class="cancion{{CLASE}}">{{CANCION}}</div>
    <div class="artista">{{ARTISTA}}</div>
    <div class="pie">{{PIE}}</div>
  </div>
</div>
<div class="foot"><img src="{{LOGO}}" alt="Triggui"><span>{{LIBRO}}</span></div>
</body>
</html>
