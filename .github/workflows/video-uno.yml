name: "Video uno (faltantes)"
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "slug a re-resolver (borra su _video y re-resuelve; modo antiguo)"
        required: false
        default: ""
      titulo:
        description: "completar sin destruir: *+ ediciones a 3 · fragmento+ ese libro (sin espera) · vacío = usar slug"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggui-content (raiz)
        uses: actions/checkout@v4
        with:
          repository: badirnakid/triggui-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          fetch-depth: 0
      - name: Checkout triggui-app (herramientas)
        uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Borrar _video del slug (solo modo slug)
        if: ${{ github.event.inputs.titulo == '' && github.event.inputs.slug != '' }}
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          python3 -c "import json,os; slug=os.environ['SLUG']; f1='contenido.json'; f2='contenido_manual.json'; d1=json.load(open(f1,encoding='utf-8')); d2=json.load(open(f2,encoding='utf-8')); n=sum(1 for d in (d1,d2) for b in d['libros'] if b.get('_slug')==slug and b.pop('_video',None) is not None); json.dump(d1, open(f1,'w',encoding='utf-8'), ensure_ascii=False, indent=2); json.dump(d2, open(f2,'w',encoding='utf-8'), ensure_ascii=False, indent=2); print('limpiado', slug, n)"
      - name: Resolver faltantes
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          pip -q install requests || true
          TITULO="${{ github.event.inputs.titulo }}"
          if [ "$TITULO" = "*+" ]; then
            python3 app/scripts/resolve-videos.py --solo-ediciones --completar-min=3 --armonia-min=5 --explicar
          elif [ -n "$TITULO" ] && [ "${TITULO%+}" != "$TITULO" ]; then
            python3 app/scripts/resolve-videos.py --solo="${TITULO%+}" --completar-min=3 --armonia-min=5 --forzar --explicar
          else
            python3 app/scripts/resolve-videos.py --solo-ediciones --armonia-min=5
          fi
      - name: Commit
        run: |
          git config user.name "triggui-bot"
          git config user.email "bot@triggui.com"
          git add contenido.json contenido_manual.json
          git diff --cached --quiet && echo "sin cambios" || git commit -m "video re-resuelto ${{ github.event.inputs.slug }}${{ github.event.inputs.titulo }}"
          git push
