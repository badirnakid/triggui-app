# 🗳️ Propuestas de libros (C480 · 17 de noviembre de 2026)
#
# El robot de propuestas: elige con el puntaje de Triggui los libros que siguen en cada lista (scripts/curaduria.py),
# revisa que se consigan en Casa del Libro o en Gandhi con la misma revisión del horno y abre un pull request por lista
# para que Badir lo apruebe con «Merge» (B436); nada se publica sin eso. No sube nada a triggui-content.
#
# El aviso a Badir, para que no se le pase (su pedido del 17 de noviembre de 2026, 18:50): cada propuesta lo menciona, se
# la asigna y le pide su revisión, y GitHub se lo manda a su correo (leído en sus ajustes el 17 de noviembre: «Participating,
# @mentions and custom» con correo). Mientras una propuesta siga abierta, cada corrida le deja un recordatorio con su
# mención y hasta qué día alcanza la lista.
#
# Horario (go de Badir del 17 de noviembre de 2026, 18:50, B438): cada martes a las 10:17 de la mañana, hora de México
# (16:17 UTC; México no cambia de horario). Así solo propone si a la lista le quedan menos de 6 títulos. A mano se puede
# correr con «forzar». Si ya hay una propuesta abierta de esa lista (su rama empieza con «propuestas/» y trae el nombre de
# la lista), no abre otra: deja el recordatorio.
#
# Palomitas y criterio (C492, go de Badir del 17 de noviembre de 2026, 19:58): cada propuesta trae una casilla por libro y
# su registro escondido; las palomitas las atiende el flujo «🗳️ Decisiones» (decisiones.yml). Las fechas que lee Badir (el
# título, la rama y la marca en la lista) van en la hora de México. Con «ensayo», el robot propone sin abrir pull requests:
# la propuesta queda en el resumen de la corrida y en su registro, para probar sin molestar a Badir.

name: 🗳️ Propuestas de libros

run-name: 🗳️ Propuestas · ${{ inputs.lista || 'martes' }}${{ inputs.ensayo && ' · ensayo' || '' }}

on:
  schedule:
    - cron: '17 16 * * 2'   # martes, 10:17 de la mañana, hora de México
  workflow_dispatch:
    inputs:
      lista:
        description: 'Qué lista'
        required: true
        default: 'las dos'
        type: choice
        options:
          - 'las dos'
          - 'adultos'
          - 'kids'
      cuantos:
        description: 'Cuántos libros por lista, de 1 a 40 (vacío: los que falten para llegar a 12, y al menos 4)'
        required: false
        type: string
      forzar:
        description: 'Proponer aunque a la lista le queden 6 o más'
        required: false
        default: true
        type: boolean
      ensayo:
        description: 'Ensayo: proponer sin abrir pull requests (la propuesta queda en el resumen de la corrida)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write   # asignarle la propuesta a Badir y dejarle el recordatorio

concurrency:
  group: propuestas
  cancel-in-progress: false

jobs:
  proponer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 triggui-content (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: badirnakid/triggui-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: triggui-content
          persist-credentials: false

      - name: ⚙️ Node.js (la revisión de tiendas del horno)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📚 Dependencias de la revisión de tiendas
        working-directory: experiments/nucleus
        run: npm ci || npm install --no-audit --no-fund

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧪 Pruebas del robot
        run: |
          python -m pip install --quiet pyyaml
          python -I -B scripts/test_curaduria.py

      - name: 🗳️ Proponer y abrir los pull requests
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LISTA: ${{ inputs.lista }}
          CUANTOS: ${{ inputs.cuantos }}
          FORZAR: ${{ inputs.forzar }}
          ENSAYO: ${{ inputs.ensayo }}
        run: |
          set -euo pipefail
          LISTA="${LISTA:-las dos}"   # el horario no trae entradas: las dos listas y sin forzar
          git config user.name "Triggui Bot"
          git config user.email "bot@triggui.com"
          hoy="$(date -u -d '6 hours ago' +%F)"   # la fecha en México (UTC-6: México no cambia de horario)
          fallas=0
          mkdir -p /tmp/registros
          for l in adultos kids; do
            if [ "$LISTA" != "las dos" ] && [ "$LISTA" != "$l" ]; then continue; fi
            if [ "$l" = "kids" ]; then nombre="Kids"; else nombre="de adultos"; fi
            abiertas=""
            if [ "${ENSAYO:-false}" != "true" ]; then
              abiertas="$(gh pr list --state open --base main --limit 100 --json number,headRefName \
                --jq ".[] | select(.headRefName | test(\"^propuestas/.*-$l-[0-9]{4}\$\")) | .number")"
            fi
            if [ -n "$abiertas" ]; then
              numero="$(printf '%s\n' "$abiertas" | head -n 1)"
              echo "::notice::Ya hay una propuesta abierta de $l (#$numero): no abro otra; le dejo a Badir el recordatorio."
              texto="$(python -I -B scripts/curaduria.py --lista "$l" --app . --recordatorio)"
              gh pr comment "$numero" --body "$texto" \
                || echo "::warning::No pude dejar el recordatorio en la #$numero."
              echo "- Propuesta $nombre abierta (#$numero): recordatorio a Badir." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            rm -rf /tmp/propuesta
            export TRIGGUI_IA_REGISTRO="/tmp/ia-propuesta-$l.jsonl"
            args=(--lista "$l" --app . --contenido triggui-content --nucleus experiments/nucleus --salida /tmp/propuesta)
            if [ -n "${CUANTOS:-}" ]; then args+=(--cuantos "$CUANTOS"); fi
            if [ "${FORZAR:-false}" = "true" ]; then args+=(--forzar); fi
            set +e
            python -I -B scripts/curaduria.py "${args[@]}"
            codigo=$?
            set -e
            if [ -f "/tmp/propuesta/propuesta-$l.json" ]; then cp "/tmp/propuesta/propuesta-$l.json" /tmp/registros/; fi
            if [ "$codigo" -ne 0 ] || [ ! -f "/tmp/propuesta/propuesta-$l.md" ]; then
              echo "::warning::Sin propuesta de $l esta vez (código $codigo)."
              echo "- Lista $nombre: sin propuesta esta vez (código $codigo)." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "${ENSAYO:-false}" = "true" ]; then
              cp "/tmp/propuesta/propuesta-$l.md" /tmp/registros/
              { echo "## Ensayo de la propuesta $nombre: no se abrió ningún pull request"; echo
                cat "/tmp/propuesta/propuesta-$l.md"; } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            rama="propuestas/$hoy-$l-$(date -u -d '6 hours ago' +%H%M)"
            git switch --quiet -c "$rama" origin/main
            printf '\n' >> "lista-$l.txt"
            cat "/tmp/propuesta/lineas-$l.txt" >> "lista-$l.txt"
            git add "lista-$l.txt"
            if [ "$l" = "kids" ]; then
              cp /tmp/propuesta/edades-kids.json edades-kids.json
              git add edades-kids.json
            fi
            git commit --quiet -m "🗳️ Propuesta de libros ($l) del $hoy: entra con el Merge de Badir"
            git push --quiet origin "$rama"
            if ! url="$(gh pr create --base main --head "$rama" --title "🗳️ Para autorizar: libros $nombre · $hoy" \
              --body-file "/tmp/propuesta/propuesta-$l.md")"; then
              # Sin pull request, la rama recién subida no sirve: se borra (si no, la próxima corrida subiría otra) y sigue la otra lista.
              echo "::warning::No pude abrir la propuesta de $l; borro su rama $rama y sigo con la otra lista."
              git push --quiet origin --delete "$rama" || echo "::warning::Tampoco pude borrar la rama $rama."
              echo "- Lista $nombre: no se pudo abrir la propuesta (la corrida termina en rojo para que se vea)." >> "$GITHUB_STEP_SUMMARY"
              fallas=$((fallas + 1))
              git switch --quiet --detach origin/main
              continue
            fi
            # El aviso a su correo: la mención del texto ya le avisa; asignársela y pedirle la revisión lo refuerzan.
            gh pr edit "$url" --add-assignee badirnakid \
              || echo "::warning::No pude asignarle la propuesta a Badir; la mención del texto le avisa igual."
            gh pr edit "$url" --add-reviewer badirnakid \
              || echo "::warning::No pude pedirle la revisión a Badir; la mención del texto le avisa igual."
            cat "/tmp/propuesta/propuesta-$l.md" >> "$GITHUB_STEP_SUMMARY"
            git switch --quiet --detach origin/main
          done
          # Si una propuesta no se pudo abrir, la corrida termina en rojo: GitHub le avisa a Badir por correo.
          if [ "$fallas" -gt 0 ]; then
            echo "::error::No se pudo abrir $fallas propuesta(s); el detalle está arriba."
            exit 1
          fi

      # El registro completo de cada corrida (juicios, puntajes, erratas del catálogo): 30 días en la corrida.
      - name: 🧾 Registro de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propuestas-registro
          path: /tmp/registros/
          if-no-files-found: ignore
          retention-days: 30
