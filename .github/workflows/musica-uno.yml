name: "Musica uno (juez)"
on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "fragmento del título a re-resolver"
        required: true
        default: "frida"
permissions:
  contents: write
jobs:
  musica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggui-content (raiz)
        uses: actions/checkout@v4
        with:
          repository: badirnakid/triggui-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          fetch-depth: 0
      - name: Checkout triggui-app (herramientas)
        uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estreno del compositor (borrar semilla del titulo)
        env:
          TITULO: ${{ github.event.inputs.titulo }}
        run: |
          python3 -c "import json,os,unicodedata; t=os.environ['TITULO']; norm=lambda s: unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower(); n=0
          for f in ('contenido.json','contenido_manual.json'):
              d=json.load(open(f,encoding='utf-8'))
              for b in d['libros']:
                  if norm(t) in norm(b.get('titulo','')) and b.pop('_musica_queries',None) is not None: n+=1
              json.dump(d,open(f,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('semillas retiradas:',n)"
      - name: Resolver musica (compositor + veto iTunes + juez armonia)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          python3 app/scripts/resolve-musica.py --solo="${{ github.event.inputs.titulo }}" --rehacer --explicar --rutas=contenido.json,contenido_manual.json
      - name: Commit
        run: |
          git config user.name "triggui-bot"
          git config user.email "bot@triggui.com"
          git add contenido.json contenido_manual.json
          git diff --cached --quiet && echo "sin cambios" || git commit -m "musica re-resuelta (juez) ${{ github.event.inputs.titulo }}"
          git push
