name: "Musica uno (juez)"
on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "fragmento de título · * ediciones · ** faltantes · *** todo · + rescate de silencios · prefijo kids:"
        required: true
        default: "frida"
permissions:
  contents: write
jobs:
  musica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggui-content (raiz)
        uses: actions/checkout@v4
        with:
          repository: badirnakid/triggui-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          fetch-depth: 0
      - name: Checkout triggui-app (herramientas)
        uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estreno del compositor (borra la semilla; se omite en modo curador con '=')
        if: ${{ !startsWith(github.event.inputs.titulo, '=') }}
        env:
          TITULO: ${{ github.event.inputs.titulo }}
        run: |
          python3 - <<'PY'
          import json,os,unicodedata
          t=os.environ['TITULO'].lstrip('=')
          t=t[5:] if t.startswith('kids:') else t
          norm=lambda s: unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower()
          n=0
          for f in ('contenido.json','contenido_manual.json','contenido_kids.json'):
              d=json.load(open(f,encoding='utf-8'))
              for b in d['libros']:
                  if norm(t) in norm(b.get('titulo','')) and b.pop('_musica_queries',None) is not None:
                      n+=1
              json.dump(d,open(f,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('semillas retiradas:',n)
          PY
      - name: Resolver musica (compositor + veto iTunes + juez armonia)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          TITULO: ${{ github.event.inputs.titulo }}
        run: |
          TITULO="${TITULO#=}"
          CAT="adulto"; RUTAS="contenido.json,contenido_manual.json"
          case "$TITULO" in kids:*) CAT="kids"; RUTAS="contenido_kids.json"; TITULO="${TITULO#kids:}";; esac
          if [ "$TITULO" = "+" ]; then
            python3 app/scripts/resolve-musica.py --catalogo="$CAT" --solo-silencios --rehacer --armonia-min=4 --explicar --rutas="$RUTAS"
          elif [ "$TITULO" = "***" ]; then
            python3 app/scripts/resolve-musica.py --catalogo="$CAT" --rehacer --explicar --rutas="$RUTAS"
          elif [ "$TITULO" = "**" ]; then
            python3 app/scripts/resolve-musica.py --catalogo="$CAT" --explicar --rutas="$RUTAS"
          elif [ "$TITULO" = "*" ]; then
            python3 app/scripts/resolve-musica.py --catalogo="$CAT" --solo-ediciones --rehacer --explicar --rutas="$RUTAS"
          else
            python3 app/scripts/resolve-musica.py --catalogo="$CAT" --solo="$TITULO" --rehacer --explicar --rutas="$RUTAS"
          fi
      - name: Commit
        run: |
          git config user.name "triggui-bot"
          git config user.email "bot@triggui.com"
          git add contenido.json contenido_manual.json contenido_kids.json
          git diff --cached --quiet && echo "sin cambios" || git commit -m "musica re-resuelta (juez) ${{ github.event.inputs.titulo }}"
          PUSH_OK=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && { PUSH_OK=1; break; }
            echo "push rebotado (intento $i) — main se movió; rebase y reintento"
            sleep 4
          done
          if [ "$PUSH_OK" != "1" ]; then echo "🔴 push falló 3 veces: el run NO guardó nada"; exit 1; fi
