# 🛒 Tiendas (B417, 14 de noviembre de 2026)
#
# Revisa en Casa del Libro y en Gandhi los libros de Triggui (las dos bases y los dos catálogos) cuya marca tiene
# 25 días o más, o todos si se pide, y aplica la marca a los catálogos («tienda_compra»). La marca decide a dónde
# lleva «Comprar» en México y qué libros puede elegir el horno en el batch, en 💭 y en 🌍.
#
# Solo corre cuando Badir lo pide desde Actions: no tiene horario. El horno ya revisa en cada corrida los libros
# nuevos y unos cuantos vencidos; este flujo es la revisión completa (unos 40 minutos para todo el catálogo, a una
# petición por segundo a cada tienda).
name: 🛒 Tiendas

on:
  workflow_dispatch:
    inputs:
      todos:
        description: '🛒 Revisar todos, no solo los de 25 días o más'
        type: boolean
        default: false

# La misma fila que el horno: los dos escriben en triggui-content y nunca al mismo tiempo.
concurrency:
  group: triggui-content-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tiendas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 📦 Checkout triggui-app
        uses: actions/checkout@v4

      - name: 📦 Checkout triggui-content (producción)
        uses: actions/checkout@v4
        with:
          repository: badirnakid/triggui-content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: triggui-content
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📚 Install nucleus deps
        working-directory: experiments/nucleus
        run: npm ci || npm install --no-audit --no-fund

      - name: 🧪 Pruebas de tiendas (sin red)
        working-directory: experiments/nucleus
        run: node test-tiendas.mjs && node test-tiendas-horno.mjs

      - name: 🛒 Revisar en Casa del Libro y en Gandhi
        working-directory: experiments/nucleus
        env:
          DIAS: ${{ inputs.todos && '0' || '25' }}
        run: |
          set -uo pipefail
          C="$GITHUB_WORKSPACE/triggui-content"
          args=(--salida "$C/data/tiendas.json" --dias "$DIAS")
          if [ -f "$C/data/tiendas.json" ]; then args+=(--previo "$C/data/tiendas.json"); fi
          for f in contenido.json contenido_kids.json; do if [ -f "$C/$f" ]; then args+=(--contenido "$C/$f"); fi; done
          for f in libros_master.csv libros_master_kids.csv; do if [ -f "$C/data/$f" ]; then args+=(--base "$C/data/$f"); fi; done
          # Lo revisado se guarda cada 25 libros: si hubo fallas de red, lo demás queda y esas se reintentan después.
          node revisar-tiendas.mjs "${args[@]}" || echo "::warning::🛒 Hubo fallas de red: se guardó lo demás y esos libros se reintentan en la siguiente revisión"

      - name: 🛒 Marcar los catálogos (tienda_compra)
        run: |
          set -euo pipefail
          C=triggui-content
          args=()
          for f in contenido.json contenido_kids.json contenido_manual.json contenido_kids_manual.json; do
            if [ -f "$C/$f" ]; then args+=(--contenido "$C/$f"); fi
          done
          # Los catálogos públicos (*_publico.json) no se tocan aquí: los vuelve a derivar el horno en su corrida.
          node experiments/nucleus/tiendas-horno.mjs marcar "${args[@]}" --tiendas "$C/data/tiendas.json"

      - name: 📤 Guardar en triggui-content
        working-directory: triggui-content
        run: |
          set -euo pipefail
          git config user.name "Triggui Bot"
          git config user.email "bot@triggui.com"
          for f in data/tiendas.json contenido.json contenido_kids.json contenido_manual.json contenido_kids_manual.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "🟡 Sin cambios"; exit 0; fi
          git commit -m "🛒 tiendas — revisión de Casa del Libro y Gandhi"
          for i in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then echo "✅ Guardado"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "❌ No se pudo guardar después de 3 intentos"; exit 1
